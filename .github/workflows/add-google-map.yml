name: Add Pinewood Google Maps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-google-map.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Google Maps embed and directions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('js/main.js')
          css = Path('css/style.css')
          m = main.read_text()

          # Helper URLs generated from official hotel name + configured address.
          anchor = "  const esc = (value) => String(value).replace(/[&<>'\\\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#039;','\\\"':'&quot;'}[ch]));\n"
          if 'function googleDirectionsUrl()' not in m:
              helper = anchor + "\n  function googleMapQuery() {\n    return encodeURIComponent(`${CONFIG.name}, ${CONFIG.address.vi}`);\n  }\n\n  function googleDirectionsUrl() {\n    return `https://www.google.com/maps/dir/?api=1&destination=${googleMapQuery()}`;\n  }\n\n  function googleEmbedUrl() {\n    return `https://www.google.com/maps?q=${googleMapQuery()}&output=embed`;\n  }\n"
              if anchor not in m:
                  raise SystemExit('Could not find esc helper anchor')
              m = m.replace(anchor, helper, 1)

          # Add directions button below the homepage address.
          old_home = '''          <div class="hotel-address">\n            <strong>${esc(addressLabel)}</strong>\n            <address>${esc(address)}</address>\n          </div>'''
          new_home = '''          <div class="hotel-address">\n            <strong>${esc(addressLabel)}</strong>\n            <address>${esc(address)}</address>\n            <a class="hotel-directions-link" href="${googleDirectionsUrl()}" target="_blank" rel="noopener noreferrer">${esc(state.lang === 'vi' ? 'Chỉ đường trên Google Maps' : 'Get directions on Google Maps')}</a>\n          </div>'''
          if old_home in m:
              m = m.replace(old_home, new_home, 1)

          # Replace Contact rendering with contact + Zalo + map/location block.
          start = m.find('  function renderContact(c) {')
          end = m.find('\n  function renderEnvironment(c) {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate renderContact block')
          new_contact = '''  function renderContact(c) {\n    const address = state.lang === 'vi' ? CONFIG.address.vi : CONFIG.address.en;\n    const locationTitle = state.lang === 'vi' ? 'VỊ TRÍ KHÁCH SẠN' : 'HOTEL LOCATION';\n    const directionsLabel = state.lang === 'vi' ? 'Chỉ đường' : 'Get Directions';\n    const locationIntro = state.lang === 'vi' ? 'Mở Google Maps để được hướng dẫn đường đi trực tiếp đến Pinewood Hotel Dalat.' : 'Open Google Maps for turn-by-turn directions to Pinewood Hotel Dalat.';\n    return pageHero(state.lang === 'vi' ? 'LIÊN HỆ' : 'CONTACT', c.ui.assistanceText) + `\n      <section class="page-section">\n        <div class="shell">\n          <div class="contact-grid">\n            <div class="contact-panel">${icon('phone')}<h2>${esc(c.ui.callReception)}</h2><p>${esc(c.ui.receptionDial)}</p><a class="phone-number" href="tel:${CONFIG.phoneTel}">${esc(CONFIG.phoneDisplay)}</a><a class="contact-email" href="mailto:${CONFIG.email}">${esc(CONFIG.email)}</a><a class="button button-primary" href="tel:${CONFIG.phoneTel}">${esc(c.ui.callReception)}</a></div>\n            <div class="contact-panel"><h2>ZALO</h2><img class="zalo-qr" alt="QR Zalo Pinewood Hotel Dalat"><p>${esc(c.ui.scanZalo)}</p></div>\n          </div>\n          <section class="contact-location" aria-label="${esc(locationTitle)}">\n            <div class="contact-map-wrap">\n              <iframe class="contact-map" src="${googleEmbedUrl()}" title="Google Maps - Pinewood Hotel Dalat" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>\n            </div>\n            <div class="contact-location-copy">\n              <p class="eyebrow">GOOGLE MAPS</p>\n              <h2>${esc(locationTitle)}</h2>\n              <address>${esc(address)}</address>\n              <p>${esc(locationIntro)}</p>\n              <a class="button button-primary directions-button" href="${googleDirectionsUrl()}" target="_blank" rel="noopener noreferrer">${esc(directionsLabel)} →</a>\n            </div>\n          </section>\n        </div>\n      </section>`;\n  }\n'''
          m = m[:start] + new_contact + m[end:]
          main.write_text(m)

          st = css.read_text()
          marker = '/* Pinewood Google Maps */'
          if marker not in st:
              st += '''\n\n/* Pinewood Google Maps */\n.hotel-directions-link {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  margin-top: 10px;\n  color: var(--pine-green);\n  font-size: 11px;\n  font-weight: 700;\n  text-decoration: none;\n  border-bottom: 1px solid rgba(12,53,34,.25);\n  padding-bottom: 2px;\n}\n.hotel-directions-link:hover { color: var(--pine-brown); border-bottom-color: currentColor; }\n.contact-location {\n  display: grid;\n  grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);\n  gap: 18px;\n  margin-top: 18px;\n  background: #fff;\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  overflow: hidden;\n  box-shadow: var(--shadow-soft);\n}\n.contact-map-wrap { min-height: 390px; background: var(--pine-offwhite); }\n.contact-map { width: 100%; height: 100%; min-height: 390px; border: 0; display: block; }\n.contact-location-copy {\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  padding: clamp(28px, 4vw, 48px);\n}\n.contact-location-copy h2 { margin: 0 0 14px; color: var(--pine-green); font-size: clamp(23px, 3vw, 32px); font-weight: 600; }\n.contact-location-copy address { margin: 0 0 14px; color: var(--pine-charcoal); font-size: 15px; line-height: 1.7; font-style: normal; }\n.contact-location-copy > p:not(.eyebrow) { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.7; }\n.directions-button { align-self: flex-start; min-width: 160px; }\n@media (max-width: 820px) {\n  .contact-location { grid-template-columns: 1fr; }\n  .contact-map-wrap, .contact-map { min-height: 300px; }\n  .contact-location-copy { padding: 26px 20px 30px; }\n  .directions-button { width: 100%; }\n}\n'''
              css.write_text(st)
          PY

          node --check js/main.js

      - name: Commit map integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js css/style.css
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Google Maps location and directions"
            git push origin main
          fi

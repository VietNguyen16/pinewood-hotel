name: Diagnose room image chunks v2
on:
  push:
    branches: [room-gallery-hq-v2]
    paths: [.asset-room-upload-q84/DIAGNOSE2]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room-gallery-hq-v2
      - run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          import base64,io,re,hashlib,subprocess
          def group(p):return ''.join(re.sub(r'\s+','',f.read_text()) for f in sorted(Path('.').glob(p)))
          g={
           'amen':group('.asset-room-upload-q84/amenities/part-*'),
           'bed':group('.asset-room-upload-q84/bedroom/part-*'),
           'bath':group('.asset-room-upload-q84/bathroom/part-*'),
           'clean':group('.asset-room-upload-q84/bathroom-clean/part-*')}
          refs={}
          for n,p in {'amen':'assets/images/pinewood-room-amenities-card.webp','bed':'assets/images/pinewood-room-stay-card.webp','bath':'assets/images/pinewood-room-bathroom-card.webp'}.items():
           r=subprocess.check_output(['git','show',f'origin/main:{p}']) if False else Path(p).read_bytes()
           refs[n]=Image.open(io.BytesIO(r)).convert('RGB').resize((64,64))
          def probe(s,label):
           try:raw=base64.b64decode(s+'='*((-len(s))%4),validate=False)
           except Exception as e:print('B64FAIL',label,e);return
           if raw[:4]!=b'RIFF':print('NORIFF',label,len(raw));return
           need=8+int.from_bytes(raw[4:8],'little')
           cut=raw[:need]
           try:
            im=Image.open(io.BytesIO(cut)).convert('RGB');im.load()
            th=im.resize((64,64)); scores={n:round(sum(ImageStat.Stat(ImageChops.difference(th,r)).rms)/3,2) for n,r in refs.items()}
            print('RIFF',label,'decoded',len(raw),'need',need,'cut',len(cut),'sha',hashlib.sha256(cut).hexdigest(),'fmt',im.format,'size',im.size,'scores',scores)
           except Exception as e:print('IMGFAIL',label,'decoded',len(raw),'need',need,e)
          probe(g['bed'],'bed')
          probe(g['amen']+g['bed'],'amen+bed')
          probe(g['amen']+g['bed'][:4],'amen+bed4')
          probe(g['bath']+g['amen'],'bath+amen')
          probe(g['bath']+g['amen'][:4],'bath+amen4')
          probe(g['bath']+g['clean'],'bath+clean')
          probe(g['clean']+g['bath'],'clean+bath')
          PY
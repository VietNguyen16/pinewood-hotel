name: Verify Gallery removed

on:
  push:
    branches:
      - remove-gallery-20260905
    paths:
      - .github/workflows/verify-gallery-removed-temp.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Gallery routes are gone
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=6a71d44e7c38aed361947db38bae47e0c5886746
          vi_code=$(curl -L -sS -o /tmp/gallery-vi.html -w '%{http_code}' "https://pinewoodhotel.vn/gallery/?qa=$COMMIT")
          en_code=$(curl -L -sS -o /tmp/gallery-en.html -w '%{http_code}' "https://pinewoodhotel.vn/en/gallery/?qa=$COMMIT")
          test "$vi_code" = "404"
          test "$en_code" = "404"
          sitemap_code=$(curl -L -sS -o /tmp/sitemap.xml -w '%{http_code}' "https://pinewoodhotel.vn/sitemap.xml?qa=$COMMIT")
          test "$sitemap_code" = "200"
          ! grep -F 'https://pinewoodhotel.vn/gallery/' /tmp/sitemap.xml
          ! grep -F 'https://pinewoodhotel.vn/en/gallery/' /tmp/sitemap.xml
          rooms_code=$(curl -L -sS -o /dev/null -w '%{http_code}' "https://pinewoodhotel.vn/phong/?qa=$COMMIT")
          en_rooms_code=$(curl -L -sS -o /dev/null -w '%{http_code}' "https://pinewoodhotel.vn/en/rooms/?qa=$COMMIT")
          test "$rooms_code" = "200"
          test "$en_rooms_code" = "200"
          echo "Gallery VI status: $vi_code"
          echo "Gallery EN status: $en_code"
          echo "Rooms VI status: $rooms_code"
          echo "Rooms EN status: $en_rooms_code"

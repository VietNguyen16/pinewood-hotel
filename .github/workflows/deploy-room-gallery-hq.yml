name: Deploy room gallery HQ

on:
  push:
    branches:
      - room-gallery-hq-v2
    paths:
      - .asset-room-upload-q84/DEPLOY-HQ

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room-gallery-hq-v2
          fetch-depth: 0

      - name: Recover valid 1920px room assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, re, subprocess

          targets={
            'amenities':('amenit',),
            'bedroom':('bedroom','sleep','stay'),
            'bathroom':('bathroom','bath')
          }
          out=Path('/tmp/room-hq'); out.mkdir(parents=True,exist_ok=True)
          best={k:None for k in targets}

          def cmd(*a,text=True):
            return subprocess.check_output(a,text=text,stderr=subprocess.DEVNULL)
          def clean(raw):
            try: s=raw.decode() if isinstance(raw,bytes) else raw
            except Exception: return None
            s=re.sub(r'\s+','',s)
            return s if s else None
          def classify(path):
            low=path.lower()
            hits=[]
            for name,keys in targets.items():
              if any(k in low for k in keys): hits.append(name)
            return hits
          def consider(name,raw,where):
            if not raw or len(raw)<80000: return
            try:
              im=Image.open(io.BytesIO(raw)); im.load()
            except Exception:
              return
            if im.size!=(1920,1920): return
            score=len(raw)
            prev=best[name]
            if prev is None or score>prev[0]:
              best[name]=(score,raw,where,im.format)
              print('CANDIDATE',name,score,im.format,where)

          # Direct image blobs in all reachable refs.
          for line in cmd('git','rev-list','--objects','--all').splitlines():
            parts=line.split(' ',1)
            if len(parts)!=2: continue
            obj,path=parts
            if not path.lower().endswith(('.webp','.jpg','.jpeg','.png')): continue
            names=classify(path)
            if not names: continue
            try: raw=cmd('git','cat-file','-p',obj,text=False)
            except Exception: continue
            for name in names: consider(name,raw,'blob '+path)

          # Reassemble text-chunk uploads from every reachable commit.
          cache={}
          commits=cmd('git','rev-list','--all').splitlines()
          for ci,commit in enumerate(commits):
            rows=cmd('git','ls-tree','-r',commit).splitlines(); groups={}
            for row in rows:
              try: meta,path=row.split('\t',1); mode,typ,sha=meta.split()
              except Exception: continue
              low=path.lower()
              if typ=='blob' and 'asset-room' in low and '/part-' in low:
                groups.setdefault(path.rsplit('/',1)[0],[]).append((path,sha))
            for parent,items in groups.items():
              names=classify(parent)
              if not names: continue
              items=sorted(items); n=len(items)
              ranges=[(0,n)]
              if n<=40:
                ranges += [(i,j) for i in range(n) for j in range(i+1,n+1) if j-i>=2]
              for i,j in ranges:
                texts=[]; ok=True
                for path,sha in items[i:j]:
                  if sha not in cache:
                    try: cache[sha]=clean(cmd('git','cat-file','-p',sha,text=False))
                    except Exception: cache[sha]=None
                  if not cache[sha]: ok=False; break
                  texts.append(cache[sha])
                if not ok: continue
                joined=''.join(texts)
                candidates=[]
                try: candidates.append(base64.b64decode(joined+'='*((-len(joined))%4),validate=False))
                except Exception: pass
                try: candidates.append(b''.join(base64.b64decode(t+'='*((-len(t))%4),validate=False) for t in texts))
                except Exception: pass
                for raw in candidates:
                  for name in names:
                    consider(name,raw,f'{commit[:10]} {parent} {i}:{j}')
            if ci%75==0: print('checked commits',ci)

          missing=[k for k,v in best.items() if v is None]
          if missing:
            raise SystemExit('No valid 1920px candidates for: '+','.join(missing))

          for name,(score,raw,where,fmt) in best.items():
            im=Image.open(io.BytesIO(raw)).convert('RGB')
            dest=out/f'{name}.webp'
            im.save(dest,'WEBP',quality=90,method=6)
            check=Image.open(dest); check.load()
            if check.size!=(1920,1920) or dest.stat().st_size<120000:
              raise SystemExit(f'Invalid output {name}: {check.size} {dest.stat().st_size}')
            print('SELECTED',name,where,'=>',dest.stat().st_size)
          PY

      - name: Patch production main and add lightbox
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/main origin/main
          cp /tmp/room-hq/amenities.webp /tmp/main/assets/images/pinewood-room-amenities-hq.webp
          cp /tmp/room-hq/bedroom.webp /tmp/main/assets/images/pinewood-room-bedroom-hq.webp
          cp /tmp/room-hq/bathroom.webp /tmp/main/assets/images/pinewood-room-bathroom-hq.webp
          cp css/room-gallery-hq.css /tmp/main/css/room-gallery-hq.css
          cp js/room-gallery.js /tmp/main/js/room-gallery.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/main')
          cfg={
            'phong/index.html':('CHI TIẾT PHÒNG','Thêm góc nhìn về không gian lưu trú','Khám phá khu vực nghỉ ngơi, tiện nghi trong phòng và phòng tắm được chuẩn bị cho một kỳ nghỉ thoải mái tại Đà Lạt.',[('bedroom','Không gian nghỉ ngơi','Hai giường, nội thất ấm áp và nhiều ánh sáng.','Phòng hai giường sáng thoáng tại Pinewood Hotel Dalat'),('amenities','Tiện nghi được chuẩn bị','Những chi tiết thiết thực cho kỳ lưu trú thuận tiện.','Tiện nghi trong phòng tại Pinewood Hotel Dalat'),('bathroom','Phòng tắm riêng','Không gian sạch sẽ, thoải mái và đầy đủ tiện nghi cơ bản.','Phòng tắm tại Pinewood Hotel Dalat')],'Trình xem ảnh phòng','Đóng ảnh lớn','Xem ảnh lớn:'),
            'en/rooms/index.html':('ROOM DETAILS','More views of the Pinewood stay','Explore the sleeping area, in-room amenities and bathroom details prepared for a comfortable stay in Da Lat.',[('bedroom','Bright sleeping space','Twin beds, warm finishes and natural light.','Bright twin guest room at Pinewood Hotel Dalat'),('amenities','Prepared amenities','Useful room details arranged for an easy stay.','In-room amenities at Pinewood Hotel Dalat'),('bathroom','Private bathroom','A clean, comfortable bathroom with essential amenities.','Guest bathroom at Pinewood Hotel Dalat')],'Room photo viewer','Close full image','View full image:')
          }
          for rel,(eye,title,desc,cards,dlg,close,view) in cfg.items():
            p=root/rel; s=p.read_text()
            cards_html=''.join(f'<figure class="room-gallery-card"><a class="room-gallery-image" href="/assets/images/pinewood-room-{key}-hq.webp?v=20260905hq3" data-room-lightbox data-title="{ttl}" aria-label="{view} {ttl}"><img src="/assets/images/pinewood-room-{key}-hq.webp?v=20260905hq3" width="1920" height="1920" loading="lazy" decoding="async" alt="{alt}"></a><figcaption><strong>{ttl}</strong><span>{cap}</span></figcaption></figure>' for key,ttl,cap,alt in cards)
            block=f'<section class="marketing-section room-gallery-section" aria-labelledby="room-gallery-title"><div class="shell"><header class="room-gallery-head"><p class="eyebrow">{eye}</p><h2 id="room-gallery-title">{title}</h2><p>{desc}</p></header><div class="room-gallery-grid">{cards_html}</div></div></section><dialog class="room-lightbox" id="room-lightbox" aria-label="{dlg}"><button class="room-lightbox-close" id="room-lightbox-close" type="button" aria-label="{close}">×</button><img class="room-lightbox-image" id="room-lightbox-image" alt=""><p class="room-lightbox-caption" id="room-lightbox-caption"></p></dialog>'
            s,n=re.subn(r'<section class="marketing-section room-gallery-section".*?</section>(?:\s*<dialog class="room-lightbox".*?</dialog>)?',block,s,count=1,flags=re.S)
            if n!=1: raise SystemExit('gallery block missing '+rel)
            if 'room-gallery-hq.css' not in s: s+='\n<link rel="stylesheet" href="/css/room-gallery-hq.css?v=20260905hq3">\n'
            if 'room-gallery.js' not in s: s+='\n<script src="/js/room-gallery.js?v=20260905hq3" defer></script>\n'
            p.write_text(s)
          PY
          cd /tmp/main
          for f in assets/images/pinewood-room-*-hq.webp; do test "$(wc -c < "$f")" -gt 120000; done
          grep -q 'data-room-lightbox' phong/index.html
          grep -q 'data-room-lightbox' en/rooms/index.html
          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phong/index.html en/rooms/index.html css/room-gallery-hq.css js/room-gallery.js assets/images/pinewood-room-*-hq.webp
          git commit -m 'Deploy high-resolution room gallery and lightbox'
          git push origin main
          git rev-parse HEAD

name: Deploy room gallery HQ

on:
  push:
    branches:
      - room-gallery-hq-v2
    paths:
      - .asset-room-upload-q84/DEPLOY-HQ

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room-gallery-hq-v2
          fetch-depth: 0

      - name: Recover exact HQ assets from every reachable commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess

          specs={
            'amenities':(160792,'44a1d8e6d0b53ff2d3e82d2a659b50efa487dbcc09db83887e2a8a1c7dd638cd'),
            'bedroom':(146756,'27173164a16ec3e6db3bf53aed0e964911b1ce7ad50eddd6e84c3882f8979885'),
            'bathroom':(195946,'ba89308bd6515561c560643dd6143259fdb124d90c89f1b4308a05b34e56a673')}
          keys={'amenities':('amenit',),'bedroom':('bedroom','sleep','room'),'bathroom':('bathroom',)}
          out=Path('/tmp/room-hq'); out.mkdir(parents=True,exist_ok=True)
          def cmd(*a,text=True): return subprocess.check_output(a,text=text,stderr=subprocess.DEVNULL)
          def clean(b):
            try: s=b.decode() if isinstance(b,bytes) else b
            except: return None
            return re.sub(r'\s+','',s)
          def hit(name,raw,where):
            size,sha=specs[name]
            if raw and len(raw)==size and hashlib.sha256(raw).hexdigest()==sha:
              (out/f'{name}.webp').write_bytes(raw); print('FOUND',name,where); return True
            return False

          # Direct historical image blobs.
          for line in cmd('git','rev-list','--objects','--all').splitlines():
            parts=line.split(' ',1)
            if len(parts)!=2: continue
            obj,path=parts; low=path.lower()
            if not any(x in low for x in ('room','amenit','bath','sleep')): continue
            if not low.endswith(('.webp','.jpg','.jpeg','.png')): continue
            raw=cmd('git','cat-file','-p',obj,text=False)
            for name in specs:
              if not (out/f'{name}.webp').exists(): hit(name,raw,'blob '+path)

          commits=cmd('git','rev-list','--all').splitlines(); cache={}
          for ci,commit in enumerate(commits):
            if all((out/f'{n}.webp').exists() for n in specs): break
            rows=cmd('git','ls-tree','-r',commit).splitlines(); groups={}
            for row in rows:
              try: meta,path=row.split('\t',1); mode,typ,sha=meta.split()
              except: continue
              low=path.lower()
              if typ=='blob' and 'asset-room' in low and '/part-' in low:
                groups.setdefault(path.rsplit('/',1)[0],[]).append((path,sha))
            for name in specs:
              if (out/f'{name}.webp').exists(): continue
              for parent,items in groups.items():
                if not any(k in parent.lower() for k in keys[name]): continue
                items=sorted(items); n=len(items); ranges=[(0,n)]
                if n<=45: ranges += [(i,j) for i in range(n) for j in range(i+1,n+1)]
                for i,j in ranges:
                  texts=[]; ok=True
                  for path,sha in items[i:j]:
                    if sha not in cache:
                      try: cache[sha]=clean(cmd('git','cat-file','-p',sha,text=False))
                      except: cache[sha]=None
                    if not cache[sha]: ok=False; break
                    texts.append(cache[sha])
                  if not ok: continue
                  joined=''.join(texts)
                  try: raw=base64.b64decode(joined+'='*((-len(joined))%4),validate=False)
                  except: raw=None
                  if hit(name,raw,f'{commit[:10]} {parent} whole {i}:{j}'): break
                  try: raw=b''.join(base64.b64decode(t+'='*((-len(t))%4),validate=False) for t in texts)
                  except: raw=None
                  if hit(name,raw,f'{commit[:10]} {parent} parts {i}:{j}'): break
                if (out/f'{name}.webp').exists(): break
            if ci%50==0: print('checked commits',ci)
          missing=[n for n in specs if not (out/f'{n}.webp').exists()]
          if missing: raise SystemExit('Missing exact HQ assets: '+','.join(missing))
          PY
          for f in /tmp/room-hq/*.webp; do file "$f" | grep -q '1920x1920'; done

      - name: Patch production main and add lightbox
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/main origin/main
          cp /tmp/room-hq/*.webp /tmp/main/assets/images/
          mv /tmp/main/assets/images/amenities.webp /tmp/main/assets/images/pinewood-room-amenities-hq.webp
          mv /tmp/main/assets/images/bedroom.webp /tmp/main/assets/images/pinewood-room-bedroom-hq.webp
          mv /tmp/main/assets/images/bathroom.webp /tmp/main/assets/images/pinewood-room-bathroom-hq.webp
          cp css/room-gallery-hq.css /tmp/main/css/room-gallery-hq.css
          cp js/room-gallery.js /tmp/main/js/room-gallery.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/main')
          cfg={
          'phong/index.html':('CHI TIẾT PHÒNG','Thêm góc nhìn về không gian lưu trú','Khám phá khu vực nghỉ ngơi, tiện nghi trong phòng và phòng tắm được chuẩn bị cho một kỳ nghỉ thoải mái tại Đà Lạt.',[('bedroom','Không gian nghỉ ngơi','Hai giường, nội thất ấm áp và nhiều ánh sáng.','Phòng hai giường sáng thoáng tại Pinewood Hotel Dalat'),('amenities','Tiện nghi được chuẩn bị','Những chi tiết thiết thực cho kỳ lưu trú thuận tiện.','Tiện nghi trong phòng tại Pinewood Hotel Dalat'),('bathroom','Phòng tắm riêng','Không gian sạch sẽ, thoải mái và đầy đủ tiện nghi cơ bản.','Phòng tắm tại Pinewood Hotel Dalat')],'Trình xem ảnh phòng','Đóng ảnh lớn','Xem ảnh lớn:'),
          'en/rooms/index.html':('ROOM DETAILS','More views of the Pinewood stay','Explore the sleeping area, in-room amenities and bathroom details prepared for a comfortable stay in Da Lat.',[('bedroom','Bright sleeping space','Twin beds, warm finishes and natural light.','Bright twin guest room at Pinewood Hotel Dalat'),('amenities','Prepared amenities','Useful room details arranged for an easy stay.','In-room amenities at Pinewood Hotel Dalat'),('bathroom','Private bathroom','A clean, comfortable bathroom with essential amenities.','Guest bathroom at Pinewood Hotel Dalat')],'Room photo viewer','Close full image','View full image:')}
          for rel,(eye,title,desc,cards,dlg,close,view) in cfg.items():
            p=root/rel; s=p.read_text()
            cards_html=''.join(f'<figure class="room-gallery-card"><a class="room-gallery-image" href="/assets/images/pinewood-room-{key}-hq.webp?v=20260905hq2" data-room-lightbox data-title="{ttl}" aria-label="{view} {ttl}"><img src="/assets/images/pinewood-room-{key}-hq.webp?v=20260905hq2" width="1920" height="1920" loading="lazy" decoding="async" alt="{alt}"></a><figcaption><strong>{ttl}</strong><span>{cap}</span></figcaption></figure>' for key,ttl,cap,alt in cards)
            block=f'<section class="marketing-section room-gallery-section" aria-labelledby="room-gallery-title"><div class="shell"><header class="room-gallery-head"><p class="eyebrow">{eye}</p><h2 id="room-gallery-title">{title}</h2><p>{desc}</p></header><div class="room-gallery-grid">{cards_html}</div></div></section><dialog class="room-lightbox" id="room-lightbox" aria-label="{dlg}"><button class="room-lightbox-close" id="room-lightbox-close" type="button" aria-label="{close}">×</button><img class="room-lightbox-image" id="room-lightbox-image" alt=""><p class="room-lightbox-caption" id="room-lightbox-caption"></p></dialog>'
            s,n=re.subn(r'<section class="marketing-section room-gallery-section".*?</section>(?:\s*<dialog class="room-lightbox".*?</dialog>)?',block,s,count=1,flags=re.S)
            if n!=1: raise SystemExit('gallery block missing '+rel)
            if 'room-gallery-hq.css' not in s: s+='\n<link rel="stylesheet" href="/css/room-gallery-hq.css?v=20260905hq2">\n'
            if 'room-gallery.js' not in s: s+='\n<script src="/js/room-gallery.js?v=20260905hq2" defer></script>\n'
            p.write_text(s)
          PY
          cd /tmp/main
          test "$(wc -c < assets/images/pinewood-room-amenities-hq.webp)" -eq 160792
          test "$(wc -c < assets/images/pinewood-room-bedroom-hq.webp)" -eq 146756
          test "$(wc -c < assets/images/pinewood-room-bathroom-hq.webp)" -eq 195946
          grep -q 'data-room-lightbox' phong/index.html
          grep -q 'data-room-lightbox' en/rooms/index.html
          git switch -C main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phong/index.html en/rooms/index.html css/room-gallery-hq.css js/room-gallery.js assets/images/pinewood-room-*-hq.webp
          git commit -m 'Deploy verified 1920px room gallery and lightbox'
          git push origin main
          git rev-parse HEAD

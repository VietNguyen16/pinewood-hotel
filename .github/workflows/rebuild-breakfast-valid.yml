name: Rebuild verified breakfast image

on:
  push:
    branches: [breakfast-room-gallery-final]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate breakfast WebP
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin breakfast-image-repair:refs/remotes/origin/breakfast-image-repair
          python3 - <<'PY'
          import base64, hashlib, re, subprocess
          from pathlib import Path

          def old(n):
              raw = subprocess.check_output(['git','show',f'origin/breakfast-image-repair:.asset-repair/breakfast/part-{n:02d}'])
              return re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)

          def corr(name):
              return Path('.asset-final/breakfast', name).read_bytes().strip()

          p0 = old(0)[:12000]
          p1 = old(1)
          p2 = old(2)
          p3 = old(3)
          o4 = old(4)
          p4 = o4[:14000] + corr('p4-block14') + o4[15000:20000]
          p5 = old(5)
          o6 = old(6)
          p6 = o6[:9000] + corr('p6-tail-a') + corr('p6-tail-b')
          p7 = old(7)
          o8 = old(8)
          p8 = o8[:4000] + corr('p8-tail')
          o9 = old(9)
          p9 = o9[:14000] + corr('p9-tail')
          p10 = corr('p10')
          encoded = b''.join([p0,p1,p2,p3,p4,p5,p6,p7,p8,p9,p10])
          assert len(encoded) == 187720, len(encoded)
          data = base64.b64decode(encoded, validate=True)
          expected = 'cb491d6fa3d1f3a61ec9d5cc1c59ae8c00eeb9de694d5576c97fa5fac8649e87'
          assert len(data) == 140790, len(data)
          assert hashlib.sha256(data).hexdigest() == expected
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          assert int.from_bytes(data[4:8], 'little') + 8 == len(data)
          Path('assets/images').mkdir(parents=True, exist_ok=True)
          for name in ['pinewood-breakfast-buffet-1600.webp','pinewood-breakfast-original.webp','pinewood-breakfast-card.webp']:
              Path('assets/images', name).write_bytes(data)
          print('VALID_BREAKFAST_WEBP', len(data), expected)
          PY

      - name: Commit clean binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .asset-final .work || true
          rm -f .github/workflows/rebuild-breakfast-valid.yml
          rm -f .github/workflows/final-breakfast-room-fix.yml
          rm -f .github/workflows/diagnose-breakfast-chunks.yml
          rm -f .github/workflows/diagnose-breakfast-blocks.yml
          git add -A
          git commit -m 'Add verified high-quality breakfast image'
          git push origin HEAD:breakfast-room-gallery-final

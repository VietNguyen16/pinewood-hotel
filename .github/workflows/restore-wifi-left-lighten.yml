name: Restore Wi-Fi split layout and lighten palette

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-wifi-left-lighten.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply requested fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore_wifi_lighten.py
          node --check js/main.js
          grep -q 'wifi-intro-panel' js/main.js
          grep -q '#FBF9F4' css/warm-theme.css
          if grep -q 'body:has(.wifi-page-section)' css/wifi-layout-fix.css; then
            echo 'Single-card Wi-Fi override still present' >&2
            exit 1
          fi
          git diff --check

      - name: Commit and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/restore-wifi-left-lighten.yml scripts/restore_wifi_lighten.py
          git add css/warm-theme.css assets/images/forest-hero.svg js/main.js css/wifi-layout-fix.css _layouts/app.html .github/workflows/restore-wifi-left-lighten.yml scripts/restore_wifi_lighten.py
          git commit -m 'Restore Wi-Fi left panel and lighten site palette'
          git push origin HEAD:main

name: Full SEO validation

on:
  push:
    branches:
      - full-seo-validation-20260905
    paths:
      - .github/workflows/full-seo-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical hreflang noindex production audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          BASE='https://pinewoodhotel.vn'
          pairs=[
            ('/','/en/'),('/phong/','/en/rooms/'),('/gallery/','/en/gallery/'),
            ('/vi-tri/','/en/location/'),('/dich-vu/','/en/services/'),('/lien-he/','/en/contact/'),
            ('/moi-truong/','/en/environment/'),('/wifi/','/en/wifi/'),('/bua-sang/','/en/breakfast/'),
            ('/thu-chao-mung/','/en/welcome/'),('/noi-quy/','/en/hotel-rules/'),('/an-toan/','/en/safety/'),
            ('/thong-tin/','/en/hotel-information/')]
          noindex={p for pair in pairs[7:] for p in pair}
          class Head(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]; self.metas=[]; self.in_head=False
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='head': self.in_head=True
              if self.in_head and tag=='link': self.links.append(d)
              if self.in_head and tag=='meta': self.metas.append(d)
            def handle_endtag(self,tag):
              if tag=='head': self.in_head=False
          failures=[]
          for vi,en in pairs:
            for route in (vi,en):
              req=urllib.request.Request(BASE+route,headers={'User-Agent':'PinewoodSEOQA/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: html=r.read().decode('utf-8','replace')
              p=Head(); p.feed(html)
              canon=[x.get('href') for x in p.links if x.get('rel')=='canonical']
              alts={x.get('hreflang'):x.get('href') for x in p.links if x.get('rel')=='alternate' and x.get('hreflang')}
              robots=[x.get('content','') for x in p.metas if x.get('name')=='robots']
              if canon != [BASE+route]: failures.append((route,'canonical',canon,BASE+route))
              if alts.get('vi') != BASE+vi: failures.append((route,'hreflang vi',alts.get('vi'),BASE+vi))
              if alts.get('en') != BASE+en: failures.append((route,'hreflang en',alts.get('en'),BASE+en))
              if not alts.get('x-default'): failures.append((route,'x-default missing',alts,None))
              if route in noindex:
                if not robots or 'noindex' not in robots[0] or 'follow' not in robots[0]: failures.append((route,'robots',robots,'noindex,follow'))
              elif robots and 'noindex' in robots[0]: failures.append((route,'unexpected noindex',robots,None))
              print(f'OK {route} canonical={canon[0] if canon else None} vi={alts.get("vi")} en={alts.get("en")} x-default={alts.get("x-default")} robots={robots[0] if robots else None}')
          if failures:
            for f in failures: print('FAIL',f)
            raise SystemExit(1)
          print(f'PASS canonical/hreflang/noindex: {len(pairs)*2} live routes')
          PY

      - name: Validate live Hotel JSON-LD against Schema.org vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          from html.parser import HTMLParser
          class LD(HTMLParser):
            def __init__(self): super().__init__(); self.capture=False; self.buf=[]; self.blocks=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='script' and d.get('type')=='application/ld+json': self.capture=True; self.buf=[]
            def handle_data(self,data):
              if self.capture: self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.capture:
                self.blocks.append(''.join(self.buf)); self.capture=False
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'PinewoodSchemaQA/1.0'})
            return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          html=get('https://pinewoodhotel.vn/')
          p=LD(); p.feed(html)
          assert p.blocks, 'No JSON-LD blocks found'
          docs=[json.loads(x) for x in p.blocks]
          entities=[]
          for doc in docs:
            if isinstance(doc,dict) and isinstance(doc.get('@graph'),list): entities.extend(doc['@graph'])
            elif isinstance(doc,dict): entities.append(doc)
          hotels=[e for e in entities if e.get('@type')=='Hotel']
          assert len(hotels)==1, f'Expected exactly one Hotel, got {len(hotels)}'
          h=hotels[0]
          required=['@id','name','url','logo','image','telephone','email','slogan','address','contactPoint']
          missing=[k for k in required if not h.get(k)]
          assert not missing, f'Hotel missing required fields: {missing}'
          assert h['@id']=='https://pinewoodhotel.vn/#hotel'
          assert h['url']=='https://pinewoodhotel.vn/'
          assert h['telephone']=='+84785098686'
          assert h['email']=='info@pinewoodhotel.vn'
          assert h['address'].get('@type')=='PostalAddress'
          assert h['contactPoint'].get('@type')=='ContactPoint'
          context=json.loads(get('https://schema.org/docs/jsonldcontext.json')).get('@context',{})
          unknown=[]
          def walk(v):
            if isinstance(v,dict):
              t=v.get('@type')
              if isinstance(t,str) and t not in context: unknown.append(('type',t))
              for k,val in v.items():
                if not k.startswith('@') and k not in context: unknown.append(('property',k))
                walk(val)
            elif isinstance(v,list):
              for x in v: walk(x)
          for d in docs: walk(d)
          assert not unknown, f'Unknown Schema.org terms: {unknown}'
          print('PASS JSON-LD syntax: all blocks parse as JSON')
          print('PASS Hotel entity: exactly one Hotel with required NAP/contact fields')
          print('PASS Schema.org vocabulary: all @types/properties are recognized in current official context')
          PY

      - name: Runtime image attribute audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/imgqa && cd /tmp/imgqa
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core >/dev/null 2>&1
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          cat > audit.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const routes=['/','/en/','/phong/','/en/rooms/','/gallery/','/en/gallery/','/vi-tri/','/en/location/','/dich-vu/','/en/services/','/lien-he/','/en/contact/','/moi-truong/','/en/environment/','/wifi/','/en/wifi/','/bua-sang/','/en/breakfast/','/thu-chao-mung/','/en/welcome/','/noi-quy/','/en/hotel-rules/','/an-toan/','/en/safety/','/thong-tin/','/en/hotel-information/'];
          const issues=[];
          for (const route of routes){
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            await page.goto('https://pinewoodhotel.vn'+route,{waitUntil:'networkidle2',timeout:45000});
            const rows=await page.evaluate(()=>[...document.images].map(img=>{const r=img.getBoundingClientRect();return{src:img.getAttribute('src')||'',srcset:img.getAttribute('srcset')||'',sizes:img.getAttribute('sizes')||'',width:img.getAttribute('width')||'',height:img.getAttribute('height')||'',loading:img.getAttribute('loading')||'',top:r.top,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,complete:img.complete};}));
            for (const x of rows){
              if(!x.src.includes('/assets/images/') || x.src.endsWith('.svg')) continue;
              if(!x.complete || !x.naturalWidth || !x.naturalHeight) issues.push([route,'decode/load',x]);
              if(!x.width || !x.height) issues.push([route,'missing width/height',x]);
              if(x.naturalWidth>=600 && (!x.srcset || !x.sizes)) issues.push([route,'missing srcset/sizes',x]);
              if(x.top>=844 && x.loading!=='lazy') issues.push([route,'below-fold not lazy',x]);
            }
            await page.close();
          }
          await browser.close();
          console.log('IMAGE_ISSUES_COUNT',issues.length);
          console.log('IMAGE_ISSUES',JSON.stringify(issues,null,2));
          JS
          CHROME="$CHROME" node audit.mjs

      - name: Lighthouse mobile Home Rooms VI EN
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lhqa && cd /tmp/lhqa
          npm init -y >/dev/null 2>&1
          npm install --silent lighthouse >/dev/null 2>&1
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          test -n "$CHROME"
          urls=('https://pinewoodhotel.vn/' 'https://pinewoodhotel.vn/phong/' 'https://pinewoodhotel.vn/en/' 'https://pinewoodhotel.vn/en/rooms/')
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            npx lighthouse "$url" --quiet --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="/tmp/lh-$i.json"
          done
          python3 - <<'PY'
          import json
          names=['home-vi','rooms-vi','home-en','rooms-en']
          for i,name in enumerate(names,1):
            d=json.load(open(f'/tmp/lh-{i}.json')); c=d['categories']; a=d['audits']
            scores={k:round(c[k]['score']*100) for k in ['performance','accessibility','best-practices','seo']}
            metrics={k:a[k].get('displayValue') for k in ['first-contentful-paint','largest-contentful-paint','cumulative-layout-shift','total-blocking-time']}
            print('LIGHTHOUSE',name,scores,metrics)
          PY

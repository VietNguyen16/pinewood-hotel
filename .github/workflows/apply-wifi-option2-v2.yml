name: Apply Pinewood WiFi Option 2 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wifi-option2-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Wi-Fi redesign
        run: python3 .github/scripts/apply_wifi_option2.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js css/style.css
          git diff --cached --quiet || git commit -m "Redesign Wi-Fi page with Pinewood option 2 layout"
          git push

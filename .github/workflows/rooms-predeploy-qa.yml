name: Rooms predeploy QA

on:
  push:
    branches:
      - rooms-production-repair-20260905
    paths:
      - .github/workflows/rooms-predeploy-qa.yml

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site with Jekyll
        shell: bash
        run: |
          set -euo pipefail
          gem install --no-document jekyll
          jekyll build --source . --destination _site
          test -f _site/phong/index.html
          test -f _site/en/rooms/index.html

      - name: Verify image files and HTML output
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = [
            'pinewood-room-bedroom-960.webp','pinewood-room-bedroom-1920.webp',
            'pinewood-room-amenities-960.webp','pinewood-room-amenities-1920.webp',
            'pinewood-room-bathroom-960.webp','pinewood-room-bathroom-1920.webp',
          ]
          for name in expected:
              p=Path('assets/images')/name
              assert p.exists() and p.stat().st_size > 0, name
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'WEBP'
                  assert im.size in ((960,960),(1920,1920))
          for html_path in ['_site/phong/index.html','_site/en/rooms/index.html']:
              html=Path(html_path).read_text(encoding='utf-8')
              for name in expected:
                  if name.endswith('-960.webp') or name.endswith('-1920.webp'):
                      assert name in html, (html_path, name)
              assert 'loading="lazy"' in html
              assert 'decoding="async"' in html
              assert 'srcset=' in html and 'sizes=' in html
          PY

      - name: Browser QA at desktop and mobile widths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --directory _site >/tmp/rooms-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node - <<'JS'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const routes = ['/phong/', '/en/rooms/'];
          const viewports = [
            {width: 1440, height: 1000, name: 'desktop'},
            {width: 375, height: 900, name: '375'},
            {width: 390, height: 900, name: '390'},
            {width: 430, height: 900, name: '430'},
          ];
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const route of routes) {
              for (const vp of viewports) {
                const page = await browser.newPage({viewport:{width:vp.width,height:vp.height}});
                const consoleErrors = [];
                const badResponses = [];
                page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
                page.on('response', res => { if (res.status() >= 400) badResponses.push(`${res.status()} ${res.url()}`); });
                const response = await page.goto(`http://127.0.0.1:4173${route}`, {waitUntil:'networkidle'});
                if (!response || response.status() !== 200) throw new Error(`${route} ${vp.name}: route status ${response && response.status()}`);
                const data = await page.evaluate(() => {
                  const imgs = [...document.querySelectorAll('.rooms-details-section .room-gallery-card img')];
                  const cards = [...document.querySelectorAll('.rooms-details-section .room-gallery-card')];
                  const bodyOverflow = document.documentElement.scrollWidth > document.documentElement.clientWidth + 1;
                  return {
                    imageCount: imgs.length,
                    images: imgs.map(i => ({src:i.currentSrc, naturalWidth:i.naturalWidth, naturalHeight:i.naturalHeight, loading:i.loading})),
                    cardWidths: cards.map(c => Math.round(c.getBoundingClientRect().width)),
                    bodyOverflow,
                  };
                });
                if (data.imageCount !== 3) throw new Error(`${route} ${vp.name}: expected 3 room images`);
                if (data.images.some(i => i.naturalWidth <= 0 || i.naturalHeight <= 0)) throw new Error(`${route} ${vp.name}: broken room image`);
                if (data.images.some(i => !/pinewood-room-(bedroom|amenities|bathroom)-(960|1920)\.webp/.test(i.src))) throw new Error(`${route} ${vp.name}: wrong image source ${JSON.stringify(data.images)}`);
                if (data.images.some(i => i.loading !== 'lazy')) throw new Error(`${route} ${vp.name}: room image not lazy`);
                if (data.bodyOverflow) throw new Error(`${route} ${vp.name}: horizontal overflow`);
                if (vp.width <= 430 && data.cardWidths.some(w => w > vp.width - 20)) throw new Error(`${route} ${vp.name}: card overflow ${data.cardWidths}`);
                if (consoleErrors.length) throw new Error(`${route} ${vp.name}: console errors ${consoleErrors.join(' | ')}`);
                if (badResponses.length) throw new Error(`${route} ${vp.name}: bad responses ${badResponses.join(' | ')}`);

                const first = page.locator('[data-room-lightbox]').first();
                await first.click();
                const dialogOpen = await page.locator('#room-lightbox').evaluate(d => d.open === true);
                if (!dialogOpen) throw new Error(`${route} ${vp.name}: lightbox did not open`);
                const lb = page.locator('#room-lightbox-image');
                await lb.waitFor({state:'visible'});
                const lbNatural = await lb.evaluate(i => ({w:i.naturalWidth,h:i.naturalHeight,src:i.src}));
                if (lbNatural.w <= 0 || lbNatural.h <= 0 || !lbNatural.src.includes('-1920.webp')) throw new Error(`${route} ${vp.name}: bad lightbox image`);
                await page.locator('#room-lightbox-close').click();
                await page.reload({waitUntil:'networkidle'});
                const reloaded = await page.locator('.rooms-details-section .room-gallery-card img').count();
                if (reloaded !== 3) throw new Error(`${route} ${vp.name}: reload regression`);
                console.log('PASS', route, vp.name, JSON.stringify(data.images.map(i => i.src)));
                await page.close();
              }
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

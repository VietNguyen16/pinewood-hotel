name: Update Pinewood Wi-Fi

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-wifi.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Wi-Fi content and order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          config = Path('js/config.js')
          main = Path('js/main.js')

          cfg = config.read_text()
          cfg = cfg.replace('ssid: "[TO BE ADDED]"', 'ssid: "Pinewood Hotel Dalat"')
          cfg = cfg.replace('password: "[TO BE ADDED]"', 'password: "***"')
          config.write_text(cfg)

          src = main.read_text()
          start = src.find('  function renderWifi(c) {')
          end = src.find('\n  function renderBreakfast(c) {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate renderWifi block')

          new_block = '''  function renderWifi(c) {\n    const wifiService = c.serviceGroups[0].items.find(i => i.icon === 'wifi');\n    return pageHero('WI-FI', wifiService.text) + `<section class="page-section"><div class="shell info-feature"><div class="feature-panel accent">${icon('wifi')}<h2>${esc(state.lang === 'vi' ? 'Wi-Fi miễn phí' : 'Complimentary Wi-Fi')}</h2><p>${esc(wifiService.text)}</p></div><div class="feature-panel"><p class="eyebrow">FREE WI-FI</p><h2>${esc(c.ui.quickAccess)}</h2><div class="wifi-boxes"><div class="wifi-box"><span>${esc(c.ui.network)}</span><strong>${esc(CONFIG.wifi.ssid)}</strong></div><div class="wifi-box"><span>${esc(c.ui.password)}</span><strong>${esc(CONFIG.wifi.password)}</strong></div></div></div></div></section>`;\n  }\n'''
          src = src[:start] + new_block + src[end:]
          main.write_text(src)
          PY

          node --check js/main.js

      - name: Commit Wi-Fi update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js js/main.js
          git commit -m "Update Wi-Fi credentials and layout"
          git push origin main

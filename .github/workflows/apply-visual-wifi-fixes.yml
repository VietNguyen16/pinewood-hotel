name: Apply Pinewood visual and Wi-Fi fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-visual-wifi-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final visual and Wi-Fi fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Lighten the global warm theme while keeping a subtle warm/ivory cast.
          warm = Path('css/warm-theme.css')
          s = warm.read_text()
          replacements = {
              '#F3E7CE': '#F7F3EA',
              '#F8EEDB': '#FBF8F2',
              '#FBF2DE': '#FCF9F2',
              '#F6E6C7': '#F2ECE1',
              '#F8EFDC': '#FCFAF5',
              '#EFE0C0': '#F2EADF',
              'rgba(248, 239, 220, .96)': 'rgba(252, 249, 242, .96)',
              '#FCF4E3': '#FEFBF5',
              '#F6E7C9': '#F5EFE4',
              '#EEDDBB': '#F4EEE3',
              '#F7ECD5': '#FAF7F1',
              '#F5E5C5': '#F5EFE4',
              '#F2E2C3': '#F1E8D8',
              '#F1E1C2': '#F4EEE3',
              'background-position: center calc(100% + 30px);': 'background-position: center calc(100% + 55px);',
              'background-position: center calc(100% + 18px);': 'background-position: center calc(100% + 32px);',
              'rgba(255, 248, 232, .94)': 'rgba(255, 252, 246, .94)',
              'rgba(252, 241, 217, .56)': 'rgba(251, 247, 239, .56)',
              'rgba(243, 231, 206, .16)': 'rgba(247, 243, 234, .16)',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected warm-theme token not found: {old}')
              s = s.replace(old, new)
          warm.write_text(s)

          # 2) Move the forest artwork itself much lower so the pines sit around the DALAT word.
          forest = Path('assets/images/forest-hero.svg')
          s = forest.read_text()
          color_replacements = {
              '#F3E7CE': '#F7F3EA',
              '#FFF6E3': '#FCF9F2',
              '#F8E8C8': '#F5EFE4',
          }
          for old, new in color_replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected forest color not found: {old}')
              s = s.replace(old, new)
          first_landscape = '  <path d="M0 300 C180 210 330 245 490 180 C680 102 820 175 965 134 C1180 75 1372 164 1600 92 V720 H0Z" fill="#A2B873" opacity="0.12"/>'
          mist = '  <rect width="1600" height="720" fill="url(#mist)"/>'
          if '<g id="lowered-forest"' not in s:
              if first_landscape not in s or mist not in s:
                  raise SystemExit('Expected forest artwork anchors not found')
              s = s.replace(first_landscape, '  <g id="lowered-forest" transform="translate(0 250)">\n' + first_landscape, 1)
              s = s.replace(mist, '  </g>\n' + mist, 1)
          forest.write_text(s)

          # 3) Make the desired Quick access card the Wi-Fi page itself, with no legacy green split panel.
          main = Path('js/main.js')
          s = main.read_text()
          new_wifi = r'''  function renderWifi(c) {
            const wifiService = c.serviceGroups[0].items.find(i => i.icon === 'wifi');
            const isVi = state.lang === 'vi';
            const qrHint = isVi
              ? 'Quét mã QR bằng camera điện thoại để kết nối Wi-Fi Pinewood Hotel Dalat.'
              : 'Scan the QR code with your phone camera to connect to Pinewood Hotel Dalat Wi-Fi.';

            return `
              <section class="page-section wifi-page-section">
                <div class="shell wifi-showcase wifi-showcase-single">
                  <article class="feature-panel wifi-access-panel wifi-option2-access">
                    <header class="wifi-access-heading">
                      <p class="eyebrow">FREE WI-FI</p>
                      <h1>${esc(c.ui.quickAccess)}</h1>
                    </header>
                    <div class="wifi-credentials">
                      <div class="wifi-credential-card">
                        <span class="wifi-credential-icon">${icon('wifi')}</span>
                        <div><span>${esc(c.ui.network)}</span><strong>${esc(CONFIG.wifi.ssid)}</strong></div>
                      </div>
                      <div class="wifi-credential-card">
                        <span class="wifi-credential-icon">${icon('shield')}</span>
                        <div><span>${esc(c.ui.password)}</span><strong>${esc(CONFIG.wifi.password)}</strong></div>
                      </div>
                    </div>
                    <div class="wifi-premium-qr-card">
                      <div class="wifi-logo-medallion" aria-hidden="true"><img src="/assets/logo/pinewood-logo.svg" alt=""></div>
                      <img class="wifi-page-qr" src="/assets/qr/wifi-pinewood.svg" alt="Wi-Fi QR - Pinewood Hotel Dalat">
                      <div class="wifi-qr-divider" aria-hidden="true"><span></span></div>
                      <strong>Pinewood Hotel Dalat</strong>
                      <p>${esc(qrHint)}</p>
                    </div>
                    <p class="wifi-access-note">${esc(wifiService.text)}</p>
                  </article>
                </div>
              </section>`;
          }

'''
          pattern = re.compile(r'  function renderWifi\(c\) \{.*?\n  function renderBreakfast\(c\) \{', re.S)
          if not pattern.search(s):
              raise SystemExit('renderWifi block not found')
          s = pattern.sub(new_wifi + '  function renderBreakfast(c) {', s, count=1)
          main.write_text(s)

          # 4) One deterministic Wi-Fi stylesheet, loaded globally so SPA navigation is correct on first click.
          wifi_css = r'''/* Pinewood Wi-Fi final layout.
   Loaded globally because the guest-information shell uses SPA navigation.
   This guarantees the first click to /wifi looks exactly like a direct reload. */

.wifi-page-section {
  padding: 58px 0 78px;
}

.wifi-showcase,
.wifi-showcase-single {
  display: block !important;
  width: min(1000px, 100%);
  max-width: 1000px;
  margin-inline: auto;
}

/* Defensive: never show the retired split/green Wi-Fi introduction panel. */
.wifi-showcase > .wifi-intro-panel {
  display: none !important;
}

.wifi-option2-access {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: clamp(38px, 5vw, 62px);
  border: 1px solid rgba(178,142,105,.34);
  border-radius: 30px;
  background: linear-gradient(180deg, #FCF9F2 0%, #F8F3E9 100%) !important;
  box-shadow: 0 18px 44px rgba(12,53,34,.07);
}

.wifi-access-heading {
  margin: 0 0 42px;
  text-align: center;
}

.wifi-access-heading .eyebrow {
  margin-bottom: 12px;
}

.wifi-access-heading h1,
.wifi-access-heading h2 {
  margin: 0;
  color: var(--pine-green);
  font-size: clamp(38px, 5vw, 64px);
  line-height: 1.06;
  font-weight: 500;
}

.wifi-credentials {
  display: grid !important;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;
  gap: 38px !important;
  align-items: stretch !important;
}

.wifi-credentials::before {
  content: none !important;
  display: none !important;
}

.wifi-credential-card,
.wifi-option2-access .wifi-credential-card {
  min-width: 0;
  min-height: 150px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 28px 32px;
  border: 1px solid rgba(178,142,105,.30);
  border-radius: 26px;
  background: #F1E8D8 !important;
  box-shadow: none;
}

.wifi-option2-access .wifi-credential-card:first-child {
  grid-column: 1 !important;
  grid-row: 1 !important;
}

.wifi-option2-access .wifi-credential-card:last-child {
  grid-column: 2 !important;
  grid-row: 1 !important;
}

.wifi-credential-icon {
  width: 60px;
  height: 60px;
  flex: 0 0 60px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(178,142,105,.24);
  border-radius: 50%;
  color: var(--pine-brown);
  background: #FCF9F2 !important;
}

.wifi-credential-icon .icon {
  width: 29px;
  height: 29px;
}

.wifi-credential-card > div {
  min-width: 0;
}

.wifi-credential-card span:not(.wifi-credential-icon) {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  text-transform: uppercase;
  letter-spacing: .12em;
}

.wifi-credential-card strong {
  display: block;
  margin-top: 10px;
  color: var(--pine-green);
  font-size: clamp(22px, 2.5vw, 34px);
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.wifi-premium-qr-card,
.wifi-option2-access .wifi-premium-qr-card {
  position: relative;
  margin-top: 70px !important;
  padding: 86px 36px 44px !important;
  text-align: center;
  border: 1px solid rgba(178,142,105,.34);
  border-radius: 30px;
  background: #FCF9F2 !important;
  box-shadow: none;
}

.wifi-option2-access .wifi-logo-medallion {
  position: absolute !important;
  top: 0 !important;
  left: 50% !important;
  width: 86px !important;
  height: 86px !important;
  padding: 11px !important;
  display: grid !important;
  place-items: center !important;
  transform: translate(-50%, -50%) !important;
  border: 1px solid rgba(178,142,105,.42) !important;
  border-radius: 50% !important;
  background: #FCF9F2 !important;
  box-shadow: 0 10px 22px rgba(12,53,34,.08) !important;
  z-index: 2 !important;
}

.wifi-option2-access .wifi-logo-medallion img {
  width: 62px !important;
  height: 62px !important;
  object-fit: contain !important;
}

.wifi-page-qr {
  width: min(450px, 72vw);
  max-width: 100%;
  height: auto;
  margin: 0 auto 26px;
  padding: 32px;
  border-radius: 18px;
  background: #fff;
}

.wifi-qr-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 4px auto 18px;
  color: var(--pine-brown);
}

.wifi-qr-divider::before,
.wifi-qr-divider::after {
  content: '';
  width: 54px;
  height: 1px;
  background: currentColor;
  opacity: .55;
}

.wifi-qr-divider span {
  width: 8px;
  height: 8px;
  border: 1px solid currentColor;
  transform: rotate(45deg);
}

.wifi-premium-qr-card > strong {
  display: block;
  color: var(--pine-green);
  font-size: clamp(20px, 2.2vw, 28px);
}

.wifi-premium-qr-card > p {
  max-width: 680px;
  margin: 14px auto 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.wifi-access-note {
  max-width: 720px;
  margin: 24px auto 0 !important;
  text-align: center;
  color: var(--muted) !important;
  font-size: 13px;
  line-height: 1.7 !important;
}

@media (max-width: 820px) {
  .wifi-page-section {
    padding: 36px 0 48px;
  }

  .wifi-option2-access {
    padding: 34px 20px 26px;
    border-radius: 24px;
  }

  .wifi-access-heading {
    margin-bottom: 30px;
  }

  .wifi-access-heading h1,
  .wifi-access-heading h2 {
    font-size: clamp(36px, 10vw, 50px);
  }

  .wifi-option2-access .wifi-credentials {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 14px !important;
  }

  .wifi-option2-access .wifi-credential-card:first-child {
    grid-column: 1 !important;
    grid-row: 1 !important;
  }

  .wifi-option2-access .wifi-credentials::before {
    content: '' !important;
    display: block !important;
    grid-column: 1 !important;
    grid-row: 2 !important;
    justify-self: center !important;
    width: 76px !important;
    height: 76px !important;
    margin: 10px 0 !important;
    border: 1px solid rgba(178,142,105,.42) !important;
    border-radius: 50% !important;
    background: #FCF9F2 url('/assets/logo/pinewood-logo.svg') center / 54px auto no-repeat !important;
    box-shadow: 0 8px 18px rgba(12,53,34,.07) !important;
  }

  .wifi-option2-access .wifi-credential-card:last-child {
    grid-column: 1 !important;
    grid-row: 3 !important;
  }

  .wifi-credential-card,
  .wifi-option2-access .wifi-credential-card {
    min-height: 118px;
    padding: 22px 20px;
    border-radius: 20px;
  }

  .wifi-credential-icon {
    width: 52px;
    height: 52px;
    flex-basis: 52px;
  }

  .wifi-option2-access .wifi-logo-medallion {
    display: none !important;
  }

  .wifi-premium-qr-card,
  .wifi-option2-access .wifi-premium-qr-card {
    margin-top: 26px !important;
    padding: 30px 18px 28px !important;
    border-radius: 24px;
  }

  .wifi-page-qr {
    width: min(390px, 78vw);
    padding: 24px;
  }
}
'''
          Path('css/wifi-layout-fix.css').write_text(wifi_css)

          # Remove the race-condition stylesheet injection from both Wi-Fi entry pages.
          for filename in ['wifi/index.html', 'en/wifi/index.html']:
              path = Path(filename)
              text = path.read_text()
              text, n = re.subn(r'<script>\n\(function \(\) \{.*?\n\}\)\(\);\n</script>\n', '', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected dynamic Wi-Fi stylesheet loader not found in {filename}')
              path.write_text(text)

          # The old v2 file becomes unused; remove it to avoid future cascade conflicts.
          old_v2 = Path('css/wifi-layout-v2.css')
          if old_v2.exists():
              old_v2.unlink()

          # Load Wi-Fi layout globally so client-side navigation has it before first render.
          layout = Path('_layouts/app.html')
          s = layout.read_text()
          expected = [
              ('<meta name="theme-color" content="#F3E7CE">', '<meta name="theme-color" content="#F7F3EA">'),
              ('<link rel="stylesheet" href="/css/warm-theme.css?v=20260905warm1">', '<link rel="stylesheet" href="/css/warm-theme.css?v=20260905warm2">'),
              ('{% if page.wifi_css %}<link rel="stylesheet" href="/css/wifi-layout-fix.css">{% endif %}', '<link rel="stylesheet" href="/css/wifi-layout-fix.css?v=20260905wifi2">'),
              ('<script src="/js/main.js?v=20260905final" defer></script>', '<script src="/js/main.js?v=20260905wifi2" defer></script>'),
          ]
          for old, new in expected:
              if old not in s:
                  raise SystemExit(f'Expected layout token not found: {old}')
              s = s.replace(old, new, 1)
          layout.write_text(s)
          PY

      - name: Validate final change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/main.js
          node --check js/seo.js
          node --check js/qr.js
          test ! -e css/wifi-layout-v2.css
          ! grep -q 'wifi-layout-v2.css' wifi/index.html
          ! grep -q 'wifi-layout-v2.css' en/wifi/index.html
          ! grep -q 'wifi-intro-panel' js/main.js
          grep -q 'wifi-layout-fix.css?v=20260905wifi2' _layouts/app.html
          grep -q 'warm-theme.css?v=20260905warm2' _layouts/app.html
          grep -q 'main.js?v=20260905wifi2' _layouts/app.html
          grep -q 'transform="translate(0 250)"' assets/images/forest-hero.svg
          grep -q '#F7F3EA' css/warm-theme.css
          git diff --check

      - name: Commit and push final fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-visual-wifi-fixes.yml
          git add -A
          git commit -m 'Refine warm palette, lower forest and fix Wi-Fi first load'
          git push origin HEAD:main

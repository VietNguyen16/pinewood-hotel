name: Finalize Pinewood visual fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-visual-wifi-fixes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make updated visual assets load deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_layouts/app.html')
          text = path.read_text()
          replacements = [
              ('<meta name="theme-color" content="#F3E7CE">', '<meta name="theme-color" content="#F7F3EA">'),
              ('<link rel="stylesheet" href="/css/warm-theme.css?v=20260905warm1">', '<link rel="stylesheet" href="/css/warm-theme.css?v=20260905warm3">'),
              ('{% if page.wifi_css %}<link rel="stylesheet" href="/css/wifi-layout-fix.css">{% endif %}', '<link rel="stylesheet" href="/css/wifi-layout-fix.css?v=20260905wifi3">'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected layout token not found: ' + old)
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit final cache-bust and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-visual-wifi-fixes.yml
          git add -A
          git commit -m 'Finalize lighter palette and deterministic Wi-Fi load'
          git push origin HEAD:main

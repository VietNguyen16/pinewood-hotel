name: Diagnose breakfast chunks
on:
  push:
    branches: [breakfast-room-gallery-final]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect chunks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin breakfast-image-repair:refs/remotes/origin/breakfast-image-repair
          python3 - <<'PY'
          import subprocess, hashlib, base64, re
          pieces=[]
          for n in range(10):
              path=f'.asset-repair/breakfast/part-{n:02d}'
              raw=subprocess.check_output(['git','show',f'origin/breakfast-image-repair:{path}'])
              clean=re.sub(rb'[^A-Za-z0-9+/=]',b'',raw)
              print(n, 'raw',len(raw),'clean',len(clean),'eq',clean.count(b'='),'sha',hashlib.sha256(clean).hexdigest(),'first',clean[:12],'last',clean[-12:])
              pieces.append(clean)
          s=b''.join(pieces)
          print('combined clean',len(s),'sha',hashlib.sha256(s).hexdigest(),'mod4',len(s)%4)
          # Decode only if possible and report RIFF declared size.
          try:
              data=base64.b64decode(s,validate=False)
              print('decoded',len(data),'sha',hashlib.sha256(data).hexdigest(),'head',data[:12])
              if len(data)>=8:
                  print('riff_declared',int.from_bytes(data[4:8],'little')+8)
          except Exception as e:
              print('decode_error',repr(e))
          PY

name: Rooms live production QA

on:
  push:
    branches:
      - rooms-production-repair-20260905
    paths:
      - .github/workflows/rooms-live-production-qa.yml

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production routes and exact image bytes
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=6532d7bf79137343236e55e87857d9d49f0f4ddd
          for route in phong/ en/rooms/; do
            code=$(curl -L -sS -o "/tmp/${route//\//_}.html" -w '%{http_code}' "https://pinewoodhotel.vn/$route?qa=$COMMIT")
            test "$code" = "200"
          done
          grep -q 'pinewood-room-bedroom-960.webp' /tmp/phong_.html
          grep -q 'pinewood-room-amenities-960.webp' /tmp/phong_.html
          grep -q 'pinewood-room-bathroom-960.webp' /tmp/phong_.html
          grep -q 'rooms-details-section' /tmp/phong_.html
          grep -q 'rooms-info-section' /tmp/phong_.html
          grep -q 'pinewood-room-bedroom-960.webp' /tmp/en_rooms_.html
          grep -q 'pinewood-room-amenities-960.webp' /tmp/en_rooms_.html
          grep -q 'pinewood-room-bathroom-960.webp' /tmp/en_rooms_.html

          declare -A HASHES=(
            [pinewood-room-bedroom-960.webp]=48d9ea6fed6235edce2da5596c1ea408bd6ae9d9afb8bbf5dcf57e0bf2b06e65
            [pinewood-room-bedroom-1920.webp]=8c40dc7c98f6f8550efefacd221cbba3e6ac17fb8735a14d37b680073259423c
            [pinewood-room-amenities-960.webp]=20e2ce15eee1ab6fe6ae4df2e637b1efb25d7e1309fd6a371bbe82c3cf2c1582
            [pinewood-room-amenities-1920.webp]=96d719aa2c21c8e5b134067f5a9e612ed988e0d4fb4f83e75ca6a332adb8dbcd
            [pinewood-room-bathroom-960.webp]=7c39480c824a45198249d5e24288b842abb10bf0781ffb405c34930837775cff
            [pinewood-room-bathroom-1920.webp]=3db403162ee43c8c54ead79b9b7469a712ed9fd215370d29011480873c33df71
          )
          for file in "${!HASHES[@]}"; do
            curl -L -sS "https://pinewoodhotel.vn/assets/images/$file?qa=$COMMIT" -o "/tmp/$file"
            actual=$(sha256sum "/tmp/$file" | awk '{print $1}')
            test "$actual" = "${HASHES[$file]}"
            echo "HASH_OK $file $actual"
          done
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in Path('/tmp').glob('pinewood-room-*.webp'):
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'WEBP'
                  assert im.size in ((960,960),(1920,1920))
              print('DECODE_OK', p.name)
          PY

      - name: Browser test production VI EN desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          node - <<'JS'
          const { chromium } = require('playwright');
          const commit = '6532d7bf79137343236e55e87857d9d49f0f4ddd';
          const routes = ['/phong/', '/en/rooms/'];
          const viewports = [
            {width:1440,height:1000,name:'desktop'},
            {width:375,height:900,name:'375'},
            {width:390,height:900,name:'390'},
            {width:430,height:900,name:'430'},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const route of routes){
              for(const vp of viewports){
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
                const consoleErrors=[]; const bad=[];
                page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
                page.on('response',r=>{if(r.status()>=400) bad.push(`${r.status()} ${r.url()}`)});
                const r=await page.goto(`https://pinewoodhotel.vn${route}?qa=${commit}`,{waitUntil:'networkidle',timeout:90000});
                if(!r || r.status()!==200) throw new Error(`${route} ${vp.name} route ${r&&r.status()}`);
                await page.locator('.rooms-details-section').scrollIntoViewIfNeeded();
                const info=await page.evaluate(()=>{
                  const imgs=[...document.querySelectorAll('.rooms-details-section .room-gallery-card img')];
                  const cards=[...document.querySelectorAll('.rooms-details-section .room-gallery-card')];
                  return {
                    count:imgs.length,
                    imgs:imgs.map(i=>({src:i.currentSrc,nw:i.naturalWidth,nh:i.naturalHeight,complete:i.complete,loading:i.loading})),
                    widths:cards.map(c=>Math.round(c.getBoundingClientRect().width)),
                    overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
                  };
                });
                if(info.count!==3) throw new Error(`${route} ${vp.name}: ${info.count} images`);
                if(info.imgs.some(i=>!i.complete||i.nw<=0||i.nh<=0)) throw new Error(`${route} ${vp.name}: broken images ${JSON.stringify(info.imgs)}`);
                if(info.imgs.some(i=>!/pinewood-room-(bedroom|amenities|bathroom)-(960|1920)\.webp/.test(i.src))) throw new Error(`${route} ${vp.name}: wrong src ${JSON.stringify(info.imgs)}`);
                if(info.imgs.some(i=>i.loading!=='lazy')) throw new Error(`${route} ${vp.name}: lazy missing`);
                if(info.overflow) throw new Error(`${route} ${vp.name}: overflow`);
                if(vp.width<=430 && info.widths.some(w=>w>vp.width-20)) throw new Error(`${route} ${vp.name}: card overflow ${info.widths}`);
                if(consoleErrors.length) throw new Error(`${route} ${vp.name}: console ${consoleErrors.join(' | ')}`);
                if(bad.length) throw new Error(`${route} ${vp.name}: network ${bad.join(' | ')}`);
                await page.locator('[data-room-lightbox]').first().click();
                const open=await page.locator('#room-lightbox').evaluate(d=>d.open===true);
                if(!open) throw new Error(`${route} ${vp.name}: lightbox not open`);
                const lb=page.locator('#room-lightbox-image');
                await lb.waitFor({state:'visible'});
                const li=await lb.evaluate(i=>({src:i.src,nw:i.naturalWidth,nh:i.naturalHeight}));
                if(li.nw<=0||li.nh<=0||!li.src.includes('-1920.webp')) throw new Error(`${route} ${vp.name}: bad lightbox ${JSON.stringify(li)}`);
                await page.locator('#room-lightbox-close').click();
                await page.reload({waitUntil:'networkidle',timeout:90000});
                if(await page.locator('.rooms-details-section .room-gallery-card img').count()!==3) throw new Error(`${route} ${vp.name}: reload regression`);
                console.log('PRODUCTION_PASS',route,vp.name,JSON.stringify(info.imgs.map(i=>i.src)));
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

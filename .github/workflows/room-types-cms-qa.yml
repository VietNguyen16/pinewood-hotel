name: Room types CMS production QA

on:
  push:
    branches:
      - room-types-cms-qa-20260905
    paths:
      - .github/workflows/room-types-cms-qa.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate room data and Pages CMS configuration
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require 'yaml'
          order = YAML.load_file('_data/room_order.yml')
          raise "expected 8 room types" unless order.size == 8
          order.each do |slug|
            path = "_data/room_types/#{slug}.yml"
            raise "missing #{path}" unless File.exist?(path)
            room = YAML.load_file(path)
            %w[enabled name_vi name_en guests bed_vi bed_en images].each do |key|
              raise "#{path}: missing #{key}" unless room.key?(key)
            end
            raise "#{path}: images must start empty" unless room['images'].is_a?(Array) && room['images'].empty?
          end
          cfg = YAML.load_file('.pages.yml')
          raise 'expected 8 room media sources' unless cfg.fetch('media').size == 8
          group = cfg.fetch('content').find { |item| item['name'] == 'room_manager' }
          raise 'room_manager missing' unless group
          raise 'expected 8 CMS room editors' unless group.fetch('items').size == 8
          puts 'CMS_CONFIG_OK 8 room types / 8 dedicated media folders'
          RUBY

      - name: Verify production HTML and sitemap
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=f79e85398d6442dd4b2ad49000796a4fb88588f7
          curl -L -sS "https://pinewoodhotel.vn/phong/?qa=$COMMIT" -o /tmp/vi.html
          curl -L -sS "https://pinewoodhotel.vn/en/rooms/?qa=$COMMIT" -o /tmp/en.html
          curl -L -sS "https://pinewoodhotel.vn/sitemap.xml?qa=$COMMIT" -o /tmp/sitemap.xml
          test "$(grep -o 'class="room-type-card' /tmp/vi.html | wc -l)" -eq 8
          test "$(grep -o 'class="room-type-card' /tmp/en.html | wc -l)" -eq 8
          for name in \
            'Double Room with Garden View' \
            'Deluxe Double or Twin Room' \
            'Junior Suite with Garden View' \
            'King Suite with Balcony' \
            'Triple Room with Balcony' \
            'Family Suite with Balcony' \
            'Twin Room with Garden View' \
            'Twin Room with City View'; do
            grep -Fq "$name" /tmp/en.html
          done
          grep -Fq 'Phòng đôi hướng vườn' /tmp/vi.html
          grep -Fq 'Phòng Twin hướng thành phố' /tmp/vi.html
          ! grep -Fq 'pinewood-room-bedroom-hq.webp' /tmp/sitemap.xml
          ! grep -Fq 'pinewood-room-amenities-hq.webp' /tmp/sitemap.xml
          ! grep -Fq 'pinewood-room-bathroom-hq.webp' /tmp/sitemap.xml
          grep -Fq 'pinewood-room-bedroom-1920.webp' /tmp/sitemap.xml
          grep -Fq 'pinewood-room-amenities-1920.webp' /tmp/sitemap.xml
          grep -Fq 'pinewood-room-bathroom-1920.webp' /tmp/sitemap.xml
          echo 'PRODUCTION_HTML_OK room types VI/EN + clean sitemap images'

      - name: Browser QA desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pwqa
          cd /tmp/pwqa
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          node - <<'JS'
          const { chromium } = require('playwright');
          const commit = 'f79e85398d6442dd4b2ad49000796a4fb88588f7';
          const routes = ['/phong/', '/en/rooms/'];
          const viewports = [
            { width: 1440, height: 1000, name: 'desktop' },
            { width: 375, height: 900, name: '375' },
            { width: 390, height: 900, name: '390' },
            { width: 430, height: 900, name: '430' },
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const route of routes) {
              for (const vp of viewports) {
                const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height } });
                const errors = [];
                const bad = [];
                page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
                page.on('response', r => { if (r.status() >= 400) bad.push(`${r.status()} ${r.url()}`); });
                const response = await page.goto(`https://pinewoodhotel.vn${route}?qa=${commit}`, { waitUntil: 'networkidle', timeout: 90000 });
                if (!response || response.status() !== 200) throw new Error(`${route} ${vp.name}: route status ${response && response.status()}`);
                const info = await page.evaluate(() => ({
                  cards: document.querySelectorAll('.room-types-section .room-type-card').length,
                  media: document.querySelectorAll('.room-types-section .room-type-media').length,
                  overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                  heading: document.querySelector('.room-types-section h2')?.textContent?.trim() || '',
                }));
                if (info.cards !== 8) throw new Error(`${route} ${vp.name}: expected 8 cards, got ${info.cards}`);
                if (info.media !== 0) throw new Error(`${route} ${vp.name}: image placeholders/media rendered before uploads`);
                if (info.overflow) throw new Error(`${route} ${vp.name}: horizontal overflow`);
                if (errors.length) throw new Error(`${route} ${vp.name}: console errors ${errors.join(' | ')}`);
                if (bad.length) throw new Error(`${route} ${vp.name}: network errors ${bad.join(' | ')}`);
                console.log('ROOM_TYPES_PASS', route, vp.name, JSON.stringify(info));
                await page.close();
              }
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

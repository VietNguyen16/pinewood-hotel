name: Fix English language assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-en-language-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch English QR paths and brand language behavior
        shell: python
        run: |
          from pathlib import Path

          main = Path('js/main.js')
          s = main.read_text(encoding='utf-8')

          s = s.replace(
              "const ZALO_QR = window.PINEWOOD_ZALO_QR || 'assets/qr/zalo-pinewood.jpg';",
              "const ZALO_QR = window.PINEWOOD_ZALO_QR || '/assets/qr/zalo-pinewood.svg';"
          )
          s = s.replace(
              'src="assets/qr/wifi-pinewood.svg"',
              'src="/assets/qr/wifi-pinewood.svg"'
          )

          needle = "    renderNav();\n    document.querySelectorAll('[data-lang]').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === state.lang));"
          replacement = "    renderNav();\n    const brandLink = document.querySelector('.brand');\n    if (brandLink) brandLink.setAttribute('href', pathTable[state.lang].home);\n    document.querySelectorAll('[data-lang]').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === state.lang));"
          if needle not in s:
              raise SystemExit('render() insertion point not found')
          s = s.replace(needle, replacement, 1)
          main.write_text(s, encoding='utf-8')

          qr = Path('js/qr.js')
          q = qr.read_text(encoding='utf-8')
          q = q.replace(
              "window.PINEWOOD_ZALO_QR = 'assets/qr/zalo-pinewood.svg';",
              "window.PINEWOOD_ZALO_QR = '/assets/qr/zalo-pinewood.svg';"
          )
          qr.write_text(q, encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js js/qr.js
          git diff --cached --quiet || git commit -m "Fix English QR and preserve language on logo home"
          git push

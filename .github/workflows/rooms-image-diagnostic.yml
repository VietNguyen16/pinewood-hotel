name: Rooms image diagnostic

on:
  push:
    branches:
      - rooms-repair-20260905
    paths:
      - .github/workflows/rooms-image-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Rooms image assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import numpy as np

          files = [
            'assets/images/pinewood-room-stay-card.webp',
            'assets/images/pinewood-room-bedroom-hq.webp',
            'assets/images/pinewood-room-amenities-card.webp',
            'assets/images/pinewood-room-amenities-hq.webp',
            'assets/images/pinewood-room-bathroom-card.webp',
            'assets/images/pinewood-room-bathroom-hq.webp',
          ]

          def ahash(im, size=16):
            x=im.convert('L').resize((size,size), Image.Resampling.LANCZOS)
            px=list(x.getdata())
            m=sum(px)/len(px)
            bits=[v>m for v in px]
            value=0
            for bit in bits:
              value=(value<<1)|int(bit)
            return f'{value:0{size*size//4}x}'

          for name in files:
            p=Path(name)
            raw=p.read_bytes()
            with Image.open(p) as im:
              im.load()
              rgb=im.convert('RGB')
              arr=np.asarray(rgb)
              r=arr[...,0].astype(int); g=arr[...,1].astype(int); b=arr[...,2].astype(int)
              purple=((r-g>40)&(b-g>30)&(r>100)&(b>100)).mean()
              mean=arr.reshape(-1,3).mean(axis=0)
              print('ASSET', name)
              print(' FORMAT', im.format, 'SIZE', im.size, 'MODE', im.mode)
              print(' SHA256', hashlib.sha256(raw).hexdigest())
              print(' AHASH16', ahash(rgb))
              print(' PURPLE_RATIO', f'{purple:.6f}')
              print(' MEAN_RGB', ','.join(f'{v:.2f}' for v in mean))
          PY

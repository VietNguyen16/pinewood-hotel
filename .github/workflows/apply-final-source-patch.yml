name: Apply final breakfast and room source patch

on:
  push:
    branches: [breakfast-room-gallery-final]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          BREAKFAST = '/assets/images/pinewood-breakfast-buffet-1600.webp'
          VERSION = '20260904s'

          # Use a brand-new canonical path everywhere to defeat browser/CDN cache of the previously corrupt asset.
          old_breakfast_refs = [
              '/assets/images/pinewood-breakfast-original.webp',
              '/assets/images/pinewood-breakfast-card.webp',
              '/assets/images/seo/pinewood-breakfast-buffet.jpg',
              '/assets/images/seo/pinewood-cafe.svg',
          ]
          for p in ROOT.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.xml'}:
                  continue
              if '.git' in p.parts or '.github' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              new = text
              for old in old_breakfast_refs:
                  new = new.replace(old, BREAKFAST)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          # Cache-bust JS/CSS references so old rendered markup cannot survive in browser cache.
          targets = [ROOT / '_layouts/app.html', ROOT / 'bua-sang/index.html', ROOT / 'en/breakfast/index.html']
          for p in targets:
              text = p.read_text(encoding='utf-8')
              for name in ['main.js', 'marketing.js', 'seo.js', 'qr.js']:
                  text = re.sub(rf'/js/{re.escape(name)}(?:\?v=[^\"\']+)?', f'/js/{name}?v={VERSION}', text)
              for name in ['style.css', 'seo-marketing.css']:
                  text = re.sub(rf'/css/{re.escape(name)}(?:\?v=[^\"\']+)?', f'/css/{name}?v={VERSION}', text)
              p.write_text(text, encoding='utf-8')

          # Make Home breakfast photography lead to the dedicated Breakfast page.
          home = ROOT / 'index.html'
          text = home.read_text(encoding='utf-8')
          text = text.replace('<a href="/dich-vu/"><img src="'+BREAKFAST+'" width="600" height="314" loading="lazy" decoding="async" alt="Cà phê và bánh tại quầy café Pinewood Hotel Dalat ở Đà Lạt"><figcaption><strong>Café & dịch vụ khách sạn</strong>Cà phê, bánh và những khoảng nghỉ thư giãn trong hành trình tại Pinewood.</figcaption></a>', '<a href="/bua-sang/"><img src="'+BREAKFAST+'" width="1600" height="900" loading="lazy" decoding="async" alt="Buffet sáng tại Pinewood Hotel Dalat, Đà Lạt"><figcaption><strong>Bữa sáng tại Pinewood Hotel Dalat</strong>Buffet sáng tại nhà hàng Pinewood, phục vụ hằng ngày từ 06:30 đến 09:00.</figcaption></a>')
          home.write_text(text, encoding='utf-8')

          home = ROOT / 'en/index.html'
          text = home.read_text(encoding='utf-8')
          text = text.replace('<a href="/en/services/"><img src="'+BREAKFAST+'" width="600" height="314" loading="lazy" decoding="async" alt="Coffee and pastries at Pinewood Hotel Dalat cafe in Da Lat"><figcaption><strong>Café & hotel services</strong>Coffee, pastries and relaxed moments as part of the Pinewood stay.</figcaption></a>', '<a href="/en/breakfast/"><img src="'+BREAKFAST+'" width="1600" height="900" loading="lazy" decoding="async" alt="Breakfast buffet at Pinewood Hotel Dalat in Da Lat"><figcaption><strong>Breakfast at Pinewood Hotel Dalat</strong>Breakfast buffet at the Pinewood restaurant, served daily from 06:30 to 09:00.</figcaption></a>')
          home.write_text(text, encoding='utf-8')

          # Dynamic Home card links to Breakfast too.
          marketing = ROOT / 'js/marketing.js'
          text = marketing.read_text(encoding='utf-8')
          text = text.replace("<a href=\"${en ? '/en/services/' : '/dich-vu/'}\">\n              <img src=\"${cafePhoto}\"", "<a href=\"${en ? '/en/breakfast/' : '/bua-sang/'}\">\n              <img src=\"${cafePhoto}\"")
          marketing.write_text(text, encoding='utf-8')

          # Add more real room views to the room pages. Supplemental 320px sources are kept at native display size to avoid upscaling blur.
          galleries = {
              'en/rooms/index.html': '''\n<section class="marketing-section room-gallery-section" aria-labelledby="room-gallery-title"><div class="shell"><header class="room-gallery-head"><p class="eyebrow">ROOM DETAILS</p><h2 id="room-gallery-title">More views of the Pinewood stay</h2><p>Explore the sleeping area, in-room amenities and bathroom details prepared for a comfortable stay in Da Lat.</p></header><div class="room-gallery-grid"><figure class="room-gallery-card"><img src="/assets/images/pinewood-room-stay-card.webp" width="320" height="320" loading="lazy" decoding="async" alt="Bright twin guest room at Pinewood Hotel Dalat"><figcaption><strong>Bright sleeping space</strong><span>Twin beds, warm finishes and natural light.</span></figcaption></figure><figure class="room-gallery-card"><img src="/assets/images/pinewood-room-amenities-card.webp" width="320" height="320" loading="lazy" decoding="async" alt="In-room amenities at Pinewood Hotel Dalat"><figcaption><strong>Prepared amenities</strong><span>Useful room details arranged for an easy stay.</span></figcaption></figure><figure class="room-gallery-card"><img src="/assets/images/pinewood-room-bathroom-card.webp" width="320" height="320" loading="lazy" decoding="async" alt="Guest bathroom at Pinewood Hotel Dalat"><figcaption><strong>Private bathroom</strong><span>A clean, comfortable bathroom with essential amenities.</span></figcaption></figure></div></div></section>\n''',
              'phong/index.html': '''\n<section class="marketing-section room-gallery-section" aria-labelledby="room-gallery-title"><div class="shell"><header class="room-gallery-head"><p class="eyebrow">CHI TIẾT PHÒNG</p><h2 id="room-gallery-title">Thêm góc nhìn về không gian lưu trú</h2><p>Khám phá khu vực nghỉ ngơi, tiện nghi trong phòng và phòng tắm được chuẩn bị cho một kỳ nghỉ thoải mái tại Đà Lạt.</p></header><div class="room-gallery-grid"><figure class="room-gallery-card"><img src="/assets/images/pinewood-room-stay-card.webp" width="320" height="320" loading="lazy" decoding="async" alt="Phòng hai giường sáng thoáng tại Pinewood Hotel Dalat"><figcaption><strong>Không gian nghỉ ngơi</strong><span>Hai giường, nội thất ấm áp và nhiều ánh sáng.</span></figcaption></figure><figure class="room-gallery-card"><img src="/assets/images/pinewood-room-amenities-card.webp" width="320" height="320" loading="lazy" decoding="async" alt="Tiện nghi trong phòng tại Pinewood Hotel Dalat"><figcaption><strong>Tiện nghi được chuẩn bị</strong><span>Những chi tiết thiết thực cho kỳ lưu trú thuận tiện.</span></figcaption></figure><figure class="room-gallery-card"><img src="/assets/images/pinewood-room-bathroom-card.webp" width="320" height="320" loading="lazy" decoding="async" alt="Phòng tắm tại Pinewood Hotel Dalat"><figcaption><strong>Phòng tắm riêng</strong><span>Không gian sạch sẽ, thoải mái và đầy đủ tiện nghi cơ bản.</span></figcaption></figure></div></div></section>\n'''
          }
          for rel, gallery in galleries.items():
              p = ROOT / rel
              text = p.read_text(encoding='utf-8')
              text = text.replace('width="1200" height="1200" decoding="async"', 'width="1080" height="810" decoding="async"', 1)
              if 'room-gallery-section' not in text:
                  marker = '</section>\n<section class="marketing-section"><div class="shell marketing-two-col">'
                  if marker not in text:
                      raise SystemExit(f'{rel}: room gallery insertion marker not found')
                  text = text.replace(marker, '</section>' + gallery + '<section class="marketing-section"><div class="shell marketing-two-col">', 1)
              p.write_text(text, encoding='utf-8')

          css = ROOT / 'css/seo-marketing.css'
          text = css.read_text(encoding='utf-8')
          if '/* Room detail gallery */' not in text:
              text += '''\n\n/* Room detail gallery */\n.room-gallery-section{padding-top:18px}.room-gallery-head{max-width:780px;margin:0 auto 24px;text-align:center}.room-gallery-head h2{margin:0;color:var(--pine-green);font-size:clamp(26px,3.4vw,38px);font-weight:500;line-height:1.2}.room-gallery-head p:not(.eyebrow){margin:12px auto 0;color:var(--muted);line-height:1.7}.room-gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,320px));justify-content:center;gap:18px}.room-gallery-card{margin:0;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow-soft)}.room-gallery-card img{display:block;width:320px;max-width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}.room-gallery-card figcaption{padding:14px 16px 17px;color:var(--muted);font-size:12px;line-height:1.55}.room-gallery-card figcaption strong,.room-gallery-card figcaption span{display:block}.room-gallery-card figcaption strong{margin-bottom:4px;color:var(--pine-green);font-size:14px}@media(max-width:760px){.room-gallery-grid{grid-template-columns:minmax(0,320px)}.room-gallery-section{padding-top:8px}}\n'''
          css.write_text(text, encoding='utf-8')

          # Validate key source behavior before committing.
          main = (ROOT / 'js/main.js').read_text(encoding='utf-8')
          assert BREAKFAST in main
          assert 'room-gallery-section' in (ROOT / 'en/rooms/index.html').read_text(encoding='utf-8')
          assert 'room-gallery-section' in (ROOT / 'phong/index.html').read_text(encoding='utf-8')
          assert not any(old in main for old in old_breakfast_refs)
          PY
          node --check js/main.js
          node --check js/marketing.js
          node --check js/seo.js
          grep -q 'pinewood-breakfast-buffet-1600.webp' js/main.js
          grep -q 'room-gallery-section' en/rooms/index.html

      - name: Commit clean source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-final-source-patch.yml
          git add -A
          git commit -m 'Fix breakfast rendering and expand room gallery'
          git push origin HEAD:breakfast-room-gallery-final

name: Finish Pinewood guest UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-guest-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch guest UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          config = Path('js/config.js')
          main = Path('js/main.js')
          index = Path('index.html')
          css = Path('css/style.css')

          cfg = config.read_text()
          if 'zaloUrl:' not in cfg:
              cfg = cfg.replace('  email: "info@pinewoodhotel.vn",\n', '  email: "info@pinewoodhotel.vn",\n  zaloUrl: "https://zaloapp.com/qr/p/1nqcsndxc8b70",\n')
          config.write_text(cfg)

          html = index.read_text()
          website_block = '''          <a class="footer-contact" href="https://pinewoodhotel.vn/">\n            <svg aria-hidden="true"><use href="#i-globe"></use></svg>\n            <span>pinewoodhotel.vn</span>\n          </a>\n        </div>'''
          website_new = '''          <a class="footer-contact" href="https://pinewoodhotel.vn/">\n            <svg aria-hidden="true"><use href="#i-globe"></use></svg>\n            <span>pinewoodhotel.vn</span>\n          </a>\n        </div>\n        <a class="footer-address" id="footer-address" href="https://www.google.com/maps/dir/?api=1&destination=Pinewood%20Hotel%20Dalat%2C%2054%20%C4%90%C6%B0%E1%BB%9Dng%20V%C3%B5%20Tr%C6%B0%E1%BB%9Dng%20To%E1%BA%A3n%2C%20%C4%90%C3%A0%20L%E1%BA%A1t%2C%20L%C3%A2m%20%C4%90%E1%BB%93ng%2C%20Vi%E1%BB%87t%20Nam" target="_blank" rel="noopener noreferrer"></a>'''
          if 'id="footer-address"' not in html:
              if website_block not in html:
                  raise SystemExit('Footer website block not found')
              html = html.replace(website_block, website_new, 1)
          index.write_text(html)

          src = main.read_text()
          wifi_start = src.find('  function renderWifi(c) {')
          wifi_end = src.find('\n  function renderBreakfast(c) {', wifi_start)
          if wifi_start == -1 or wifi_end == -1:
              raise SystemExit('renderWifi block not found')
          wifi_block = '''  function renderWifi(c) {\n    const wifiService = c.serviceGroups[0].items.find(i => i.icon === 'wifi');\n    const connectLabel = state.lang === 'vi' ? 'KẾT NỐI WI-FI' : 'CONNECT TO WI-FI';\n    const connectHint = state.lang === 'vi' ? 'Nhấn để kết nối nhanh' : 'Click here to connect';\n    const copyLabel = state.lang === 'vi' ? 'Sao chép mật khẩu' : 'Copy password';\n    const qrLabel = state.lang === 'vi' ? 'Hiển thị QR Wi-Fi' : 'Show Wi-Fi QR';\n    const qrHint = state.lang === 'vi' ? 'Quét bằng thiết bị khác để kết nối nhanh với Wi-Fi khách sạn.' : 'Scan with another device for quick access to the hotel Wi-Fi.';\n    return pageHero('WI-FI', wifiService.text) + `<section class="page-section"><div class="shell info-feature"><div class="feature-panel accent">${icon('wifi')}<h2>${esc(state.lang === 'vi' ? 'Wi-Fi miễn phí' : 'Complimentary Wi-Fi')}</h2><p>${esc(wifiService.text)}</p></div><div class="feature-panel wifi-access-panel"><p class="eyebrow">FREE WI-FI</p><h2>${esc(c.ui.quickAccess)}</h2><button class="wifi-connect-button" type="button" data-wifi-connect>${icon('wifi')}<span><strong>${esc(connectLabel)}</strong><small>${esc(connectHint)}</small></span></button><div class="wifi-boxes"><div class="wifi-box"><span>${esc(c.ui.network)}</span><strong>${esc(CONFIG.wifi.ssid)}</strong></div><div class="wifi-box"><span>${esc(c.ui.password)}</span><strong>${esc(CONFIG.wifi.password)}</strong></div></div><div class="wifi-actions"><button class="button wifi-secondary-button" type="button" data-wifi-copy>${esc(copyLabel)}</button><button class="button wifi-secondary-button" type="button" data-wifi-qr>${esc(qrLabel)}</button></div><p class="wifi-status" data-wifi-status hidden></p><div class="wifi-qr-panel" data-wifi-qr-panel hidden><img src="assets/qr/wifi-pinewood.svg" alt="Wi-Fi QR - Pinewood Hotel Dalat"><strong>${esc(CONFIG.wifi.ssid)}</strong><p>${esc(qrHint)}</p></div></div></div></section>`;\n  }\n'''
          src = src[:wifi_start] + wifi_block + src[wifi_end:]

          footer_line = "    document.getElementById('footer-line').textContent = CONFIG.slogan[state.lang];\n"
          footer_extra = "    document.getElementById('footer-address').textContent = CONFIG.address[state.lang];\n"
          if footer_extra not in src:
              if footer_line not in src:
                  raise SystemExit('footer render line not found')
              src = src.replace(footer_line, footer_line + footer_extra, 1)

          old_qr = '''  function setQrSources() {\n    document.querySelectorAll('.zalo-qr').forEach(img => {\n      img.src = ZALO_QR;\n    });\n  }\n\n  function bindDynamicActions() {\n    document.querySelectorAll('[data-open-support]').forEach(btn => btn.addEventListener('click', openSupport));\n  }'''
          new_qr = '''  function setQrSources() {\n    document.querySelectorAll('.zalo-qr').forEach(img => {\n      img.src = ZALO_QR;\n      img.setAttribute('role', 'link');\n      img.setAttribute('tabindex', '0');\n      img.setAttribute('aria-label', state.lang === 'vi' ? 'Mở Zalo Pinewood Hotel Dalat' : 'Open Pinewood Hotel Dalat on Zalo');\n      img.setAttribute('title', state.lang === 'vi' ? 'Chạm để mở Zalo' : 'Tap to open Zalo');\n    });\n  }\n\n  function copyText(value) {\n    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(value);\n    const area = document.createElement('textarea');\n    area.value = value;\n    area.setAttribute('readonly', '');\n    area.style.position = 'fixed';\n    area.style.opacity = '0';\n    document.body.appendChild(area);\n    area.select();\n    document.execCommand('copy');\n    area.remove();\n    return Promise.resolve();\n  }\n\n  function showWifiStatus() {\n    const status = document.querySelector('[data-wifi-status]');\n    if (!status) return;\n    const isAndroid = /Android/i.test(navigator.userAgent);\n    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);\n    let message;\n    if (state.lang === 'vi') {\n      message = isIOS ? `Mật khẩu đã được sao chép. Mở Cài đặt → Wi-Fi, chọn “${CONFIG.wifi.ssid}” và dán mật khẩu.` : isAndroid ? `Mật khẩu đã được sao chép. Mở Wi-Fi, chọn “${CONFIG.wifi.ssid}” và dán mật khẩu.` : `Mật khẩu đã được sao chép. Chọn mạng “${CONFIG.wifi.ssid}” để kết nối.`;\n    } else {\n      message = isIOS ? `Password copied. Open Settings → Wi-Fi, choose “${CONFIG.wifi.ssid}” and paste the password.` : isAndroid ? `Password copied. Open Wi-Fi, choose “${CONFIG.wifi.ssid}” and paste the password.` : `Password copied. Choose “${CONFIG.wifi.ssid}” to connect.`;\n    }\n    status.textContent = message;\n    status.hidden = false;\n  }\n\n  function bindDynamicActions() {\n    document.querySelectorAll('[data-open-support]').forEach(btn => btn.addEventListener('click', openSupport));\n    document.querySelectorAll('[data-wifi-connect], [data-wifi-copy]').forEach(btn => btn.addEventListener('click', () => {\n      copyText(CONFIG.wifi.password).then(showWifiStatus).catch(showWifiStatus);\n    }));\n    document.querySelectorAll('[data-wifi-qr]').forEach(btn => btn.addEventListener('click', () => {\n      const panel = document.querySelector('[data-wifi-qr-panel]');\n      if (!panel) return;\n      panel.hidden = !panel.hidden;\n      if (!panel.hidden) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    }));\n  }'''
          if old_qr not in src:
              raise SystemExit('QR/bind block not found')
          src = src.replace(old_qr, new_qr, 1)

          old_click = '''  document.addEventListener('click', event => {\n    const route = event.target.closest('[data-route]');\n    if (route) {\n      const url = new URL(route.href, window.location.origin);\n      if (url.origin === window.location.origin) {\n        event.preventDefault();\n        navigateTo(url.pathname);\n      }\n    }\n    const langButton = event.target.closest('[data-lang]');\n    if (langButton) setLanguage(langButton.dataset.lang);\n  });'''
          new_click = '''  document.addEventListener('click', event => {\n    const zaloQr = event.target.closest('.zalo-qr');\n    if (zaloQr) {\n      event.preventDefault();\n      window.open(CONFIG.zaloUrl, '_blank', 'noopener,noreferrer');\n      return;\n    }\n    const route = event.target.closest('[data-route]');\n    if (route) {\n      const url = new URL(route.href, window.location.origin);\n      if (url.origin === window.location.origin) {\n        event.preventDefault();\n        navigateTo(url.pathname);\n      }\n    }\n    const langButton = event.target.closest('[data-lang]');\n    if (langButton) setLanguage(langButton.dataset.lang);\n    if (!mobileMenu.hidden && !event.target.closest('#mobile-menu') && !event.target.closest('#menu-button')) closeMenu();\n  });\n\n  document.addEventListener('keydown', event => {\n    if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('zalo-qr')) {\n      event.preventDefault();\n      window.open(CONFIG.zaloUrl, '_blank', 'noopener,noreferrer');\n    }\n    if (event.key === 'Escape' && !mobileMenu.hidden) closeMenu();\n  });'''
          if old_click not in src:
              raise SystemExit('document click block not found')
          src = src.replace(old_click, new_click, 1)
          main.write_text(src)

          st = css.read_text()
          marker = '/* Pinewood guest UX enhancements */'
          if marker not in st:
              st += '''\n\n/* Pinewood guest UX enhancements */\n.footer-address { display:inline-block; margin-top:10px; color:rgba(255,255,255,.78); font-size:12px; line-height:1.55; text-decoration:none; max-width:680px; }\n.footer-address:hover { color:#fff; text-decoration:underline; text-underline-offset:3px; }\n.zalo-qr { cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; }\n.zalo-qr:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.10); }\n.wifi-access-panel { align-items:stretch; }\n.wifi-connect-button { width:100%; display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0; padding:18px 22px; border:0; border-radius:18px; background:var(--pine-green); color:#fff; font:inherit; cursor:pointer; box-shadow:var(--shadow-soft); }\n.wifi-connect-button .icon { width:28px; height:28px; flex:0 0 auto; }\n.wifi-connect-button span { display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; }\n.wifi-connect-button strong { font-size:15px; letter-spacing:.04em; }\n.wifi-connect-button small { font-size:11px; opacity:.82; text-transform:uppercase; letter-spacing:.06em; }\n.wifi-connect-button:hover { transform:translateY(-1px); }\n.wifi-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }\n.wifi-secondary-button { width:100%; background:#fff; color:var(--pine-green); border:1px solid var(--line); }\n.wifi-status { margin:16px 0 0; padding:14px 16px; border-radius:14px; background:var(--pine-offwhite); color:var(--pine-green); font-size:13px; line-height:1.6; }\n.wifi-qr-panel { margin-top:16px; padding:22px; text-align:center; border:1px solid var(--line); border-radius:18px; background:#fff; }\n.wifi-qr-panel img { display:block; width:min(220px,72vw); height:auto; margin:0 auto 12px; border-radius:10px; }\n.wifi-qr-panel strong { display:block; color:var(--pine-green); }\n.wifi-qr-panel p { margin:8px auto 0; max-width:420px; font-size:12px; line-height:1.6; color:var(--muted); }\n@media (max-width:820px) { .wifi-actions { grid-template-columns:1fr; } .wifi-connect-button { padding:17px 18px; border-radius:16px; } .footer-address { font-size:11px; } }\n'''
          css.write_text(st)
          PY
          node --check js/main.js
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js js/main.js index.html css/style.css
          git commit -m "Improve Wi-Fi, footer, mobile menu and Zalo UX"
          git push origin main

name: Finalize responsive content images

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/responsive-image-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate responsive WebP variants and patch markup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, re

          def validate(path, expected=None):
              p=Path(path)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  im.load()
                  if expected:
                      assert im.size == expected, (p, im.size, expected)
                  print('IMAGE', p, im.format, im.size, hashlib.sha256(p.read_bytes()).hexdigest())

          validate('assets/images/pinewood-room-home.webp', (1080,810))
          validate('assets/images/pinewood-breakfast-buffet-1600.webp', (1600,900))

          with Image.open('assets/images/pinewood-room-home.webp') as im:
              im.load()
              out=im.resize((540,405), Image.Resampling.LANCZOS)
              out.save('assets/images/pinewood-room-home-540.webp', 'WEBP', quality=86, method=6)
          with Image.open('assets/images/pinewood-breakfast-buffet-1600.webp') as im:
              im.load()
              out=im.resize((800,450), Image.Resampling.LANCZOS)
              out.save('assets/images/pinewood-breakfast-buffet-800.webp', 'WEBP', quality=86, method=6)

          validate('assets/images/pinewood-room-home-540.webp', (540,405))
          validate('assets/images/pinewood-breakfast-buffet-800.webp', (800,450))

          room_src='/assets/images/pinewood-room-home.webp'
          room_set='/assets/images/pinewood-room-home-540.webp 540w, /assets/images/pinewood-room-home.webp 1080w'
          cafe_src='/assets/images/pinewood-breakfast-buffet-1600.webp'
          cafe_set='/assets/images/pinewood-breakfast-buffet-800.webp 800w, /assets/images/pinewood-breakfast-buffet-1600.webp 1600w'

          candidates=list(Path('.').rglob('*.html')) + list(Path('js').glob('*.js'))
          for path in candidates:
              if '.git' in path.parts:
                  continue
              s=path.read_text(errors='strict')
              original=s

              def patch_literal(text, src, srcset, sizes):
                  pattern=re.compile(r'<img\b(?=[^>]*src="'+re.escape(src)+r'")[^>]*>')
                  def repl(m):
                      tag=m.group(0)
                      if 'srcset=' not in tag:
                          tag=tag.replace(f'src="{src}"', f'src="{src}" srcset="{srcset}" sizes="{sizes}"', 1)
                      return tag
                  return pattern.sub(repl, text)

              s=patch_literal(s, room_src, room_set, '(max-width: 720px) 92vw, 600px')
              s=patch_literal(s, cafe_src, cafe_set, '(max-width: 720px) 92vw, 600px')

              # Correct old 600x314 breakfast placeholders to the actual 16:9 intrinsic ratio.
              s=re.sub(r'(<img\b(?=[^>]*pinewood-breakfast-buffet-1600\.webp)[^>]*?)width="600"\s+height="314"', r'\1width="1600" height="900"', s)

              # Dynamic marketing templates use variables rather than literal src attributes.
              s=s.replace(
                  '<img src="${roomPhoto}" width="600" height="450" loading="lazy" decoding="async"',
                  '<img src="${roomPhoto}" srcset="/assets/images/pinewood-room-home-540.webp 540w, /assets/images/pinewood-room-home.webp 1080w" sizes="(max-width: 720px) 92vw, 600px" width="600" height="450" loading="lazy" decoding="async"')
              s=s.replace(
                  '<img src="${cafePhoto}" width="600" height="314" loading="lazy" decoding="async"',
                  '<img src="${cafePhoto}" srcset="/assets/images/pinewood-breakfast-buffet-800.webp 800w, /assets/images/pinewood-breakfast-buffet-1600.webp 1600w" sizes="(max-width: 720px) 92vw, 600px" width="1600" height="900" loading="lazy" decoding="async"')

              if s != original:
                  path.write_text(s)
                  print('PATCHED', path)

          # Room feature photo is above the mobile fold; keep it eager but give it responsive candidates.
          for p in [Path('phong/index.html'), Path('en/rooms/index.html')]:
              s=p.read_text()
              s=s.replace('sizes="(max-width: 720px) 92vw, 600px" width="1080" height="810"', 'sizes="(max-width: 900px) 92vw, 1080px" width="1080" height="810"')
              p.write_text(s)

          # Breakfast route hero/image is also above the mobile fold; no lazy attribute is added.
          for p in [Path('js/main.js')]:
              s=p.read_text()
              s=s.replace('sizes="(max-width: 720px) 92vw, 600px" width="1600" height="900" decoding="async"', 'sizes="(max-width: 900px) 92vw, 900px" width="1600" height="900" decoding="async"')
              p.write_text(s)

          # Static source validation for the two large photographic sources.
          errors=[]
          for path in candidates:
              if '.git' in path.parts:
                  continue
              text=path.read_text(errors='strict')
              for tag in re.findall(r'<img\b[^>]*(?:pinewood-room-home|pinewood-breakfast-buffet-1600)\.webp[^>]*>', text):
                  for token in ('srcset=', 'sizes=', 'width=', 'height='):
                      if token not in tag:
                          errors.append((str(path), token, tag[:240]))
          if errors:
              raise SystemExit('Responsive image markup incomplete: '+repr(errors))
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check js/main.js
          node --check js/marketing.js
          git diff --check
          test -s assets/images/pinewood-room-home-540.webp
          test -s assets/images/pinewood-breakfast-buffet-800.webp

      - name: Commit final responsive image work and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/responsive-image-finalize.yml
          git add assets/images/pinewood-room-home-540.webp assets/images/pinewood-breakfast-buffet-800.webp index.html en/index.html phong/index.html en/rooms/index.html dich-vu/index.html en/services/index.html js/main.js js/marketing.js
          git commit -m 'Optimize responsive content images'
          git push origin HEAD:main

name: Pinewood P1 UX SEO refinements

on:
  push:
    branches: [main]
    paths: [.github/workflows/p1-ux-seo.yml]

permissions:
  contents: write

jobs:
  p1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply P1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('js/main.js')
          s = main.read_text()
          old = "<p class=\"hero-copy\">${esc(state.lang === 'vi' ? 'Chào mừng Quý khách đến với Pinewood Hotel Dalat' : 'Welcome to Pinewood Hotel Dalat')}</p>"
          new = "<p class=\"hero-copy\">${esc(state.lang === 'vi' ? 'Ngủ ngon · Ấm áp · Đậm chất Đà Lạt' : 'Sleep Well · Stay Warm · Feel Dalat')}</p>"
          if old not in s: raise SystemExit('home slogan anchor missing')
          s = s.replace(old, new, 1)
          old = "            <div class=\"wifi-credentials\">\n              <div class=\"wifi-credential-card\">\n                <span class=\"wifi-credential-icon\">${icon('wifi')}</span>\n                <div><span>${esc(c.ui.network)}</span><strong>${esc(CONFIG.wifi.ssid)}</strong></div>\n              </div>\n              <div class=\"wifi-credential-card\">\n                <span class=\"wifi-credential-icon\">${icon('shield')}</span>\n                <div><span>${esc(c.ui.password)}</span><strong>${esc(CONFIG.wifi.password)}</strong></div>\n              </div>\n            </div>\n            <div class=\"wifi-premium-qr-card\">\n              <div class=\"wifi-logo-medallion\" aria-hidden=\"true\"><img src=\"/assets/logo/pinewood-logo.svg\" alt=\"\"></div>"
          new = "            <div class=\"wifi-credentials\">\n              <div class=\"wifi-credential-card\">\n                <span class=\"wifi-credential-icon\">${icon('wifi')}</span>\n                <div><span>${esc(c.ui.network)}</span><strong>${esc(CONFIG.wifi.ssid)}</strong></div>\n              </div>\n              <div class=\"wifi-credentials-logo\" aria-label=\"Pinewood Hotel Dalat\"><img src=\"/assets/logo/pinewood-logo.svg\" alt=\"Pinewood Hotel Dalat\" width=\"52\" height=\"56\"></div>\n              <div class=\"wifi-credential-card\">\n                <span class=\"wifi-credential-icon\">${icon('shield')}</span>\n                <div><span>${esc(c.ui.password)}</span><strong>${esc(CONFIG.wifi.password)}</strong></div>\n              </div>\n            </div>\n            <div class=\"wifi-premium-qr-card\">"
          if old not in s: raise SystemExit('wifi anchor missing')
          main.write_text(s.replace(old, new, 1))
          Path('js/qr.js').write_text("window.PINEWOOD_ZALO_QR = '/assets/qr/zalo-pinewood.svg';\n")

          Path('css/wifi-layout-fix.css').write_text("/* P1 Wi-Fi: retain green panel; arrange SSID | logo | password. */\n@media (min-width:821px){.wifi-option2-access .wifi-credentials{display:grid!important;grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr)!important;gap:18px!important;align-items:stretch!important}.wifi-option2-access .wifi-credentials::before{content:none!important;display:none!important}.wifi-option2-access .wifi-credential-card:first-child{grid-column:1!important;grid-row:1!important}.wifi-option2-access .wifi-credentials-logo{grid-column:2!important;grid-row:1!important;align-self:center!important;justify-self:center!important}.wifi-option2-access .wifi-credential-card:last-child{grid-column:3!important;grid-row:1!important}.wifi-option2-access .wifi-credential-card{width:100%!important;min-width:0!important;height:100%!important}}\n.wifi-credentials-logo{width:72px;height:72px;padding:9px;display:grid;place-items:center;border:1px solid rgba(178,142,105,.34);border-radius:50%;background:var(--pine-warm-surface,#FFFCF7);box-shadow:0 8px 18px rgba(12,53,34,.07)}.wifi-credentials-logo img{width:52px;height:56px;object-fit:contain}.wifi-option2-access .wifi-premium-qr-card{margin-top:22px!important;padding:28px!important}.wifi-option2-access .wifi-logo-medallion{display:none!important}\n@media (max-width:820px){.wifi-option2-access .wifi-credentials{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:14px!important;align-items:stretch!important}.wifi-option2-access .wifi-credentials::before{content:none!important;display:none!important}.wifi-option2-access .wifi-credential-card:first-child{grid-column:1!important;grid-row:1!important}.wifi-option2-access .wifi-credentials-logo{grid-column:1!important;grid-row:2!important;justify-self:center!important;margin:4px 0!important}.wifi-option2-access .wifi-credential-card:last-child{grid-column:1!important;grid-row:3!important}.wifi-option2-access .wifi-premium-qr-card{margin-top:18px!important;padding:22px 16px 20px!important}}\n")

          style = Path('css/style.css')
          s = style.read_text()
          imp = "@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');\n\n"
          if imp not in s: raise SystemExit('font import missing')
          style.write_text(s.replace(imp, '', 1))
          Path('css/p1-ux.css').write_text("/* P1 UX consistency */\n:root{--radius-xl:24px;--radius-lg:24px;--radius-md:18px;--pine-image-radius:22px}.page-section:not(.wifi-page-section),.marketing-section,.seo-marketing-section{padding-top:84px;padding-bottom:84px}.hotel-photo-card,.room-gallery-card,.room-gallery-image,.room-gallery-image img{border-radius:var(--pine-image-radius)}.button,.menu-button,.language-switcher button,.dialog-close,.welcome-dialog-close,.room-lightbox-close,.seo-social-strip a,.footer-social-links a{min-height:44px}:where(a,button,summary,[tabindex]):focus-visible{outline:3px solid rgba(178,142,105,.95);outline-offset:3px}.seo-social-strip a{display:inline-flex;align-items:center;justify-content:center}@media(max-width:720px){.page-section:not(.wifi-page-section),.marketing-section,.seo-marketing-section{padding-top:56px;padding-bottom:56px}.seo-social-strip{align-items:stretch}.seo-social-strip a{width:100%}}\n")

          layout = Path('_layouts/app.html')
          s = layout.read_text()
          pre = '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
          font = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">'
          if font not in s: s = s.replace(pre, pre + '\n  ' + font, 1)
          anchor = '<link rel="stylesheet" href="/css/wifi-layout-fix.css?v=20260905wifi4">'
          p1 = '<link rel="stylesheet" href="/css/p1-ux.css?v=20260905p1">'
          if p1 not in s:
              if anchor not in s: raise SystemExit('wifi css layout anchor missing')
              s = s.replace(anchor, '<link rel="stylesheet" href="/css/wifi-layout-fix.css?v=20260905p1">\n  ' + p1, 1)
          reviews = 'https://www.google.com/maps/place/Kh%C3%A1ch+s%E1%BA%A1n+Pinewood/@11.9611181,108.4486208,1207m/data=!3m1!1e3!4m11!3m10!1s0x3171130010cadc19:0xdcb299e4322ab577!5m2!4m1!1i2!8m2!3d11.9611181!4d108.4512011!9m1!1b1!16s%2Fg%2F11njdj19vf?entry=ttu&g_ep=EgoyMDI2MDgzMS4wIKXMDSoASAFQAw%3D%3D'
          tiktok = '          <a href="https://www.tiktok.com/@dalat.pinewood" target="_blank" rel="me noopener noreferrer">TikTok · @dalat.pinewood</a>'
          review = '          <a href="' + reviews + '" target="_blank" rel="noopener noreferrer">{% if page.lang == \'en\' %}Google Reviews{% else %}Đánh giá Google Maps{% endif %}</a>'
          if review not in s: s = s.replace(tiktok, tiktok + '\n' + review, 1)
          s = s.replace('/js/qr.js?v=20260905final','/js/qr.js?v=20260905p1').replace('/js/main.js?v=20260905wifi4','/js/main.js?v=20260905p1')
          layout.write_text(s)
          PY
      - name: Validate P1
        shell: bash
        run: |
          set -euo pipefail
          node --check js/main.js
          node --check js/qr.js
          node --check js/marketing.js
          grep -q 'wifi-intro-panel' js/main.js
          grep -q 'wifi-credentials-logo' js/main.js
          grep -q 'grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr)' css/wifi-layout-fix.css
          grep -q 'Google Reviews' _layouts/app.html
          grep -q '/css/p1-ux.css?v=20260905p1' _layouts/app.html
          ! grep -R 'MutationObserver' js
          ! grep -q '@import url(' css/style.css
          grep -q 'srcset=' phong/index.html
          grep -q 'srcset=' en/rooms/index.html
          grep -q 'srcset=' gallery/index.html
          grep -q 'srcset=' en/gallery/index.html
          test -f assets/qr/wifi-pinewood.svg
          test -f assets/qr/zalo-pinewood.svg
          test -f assets/logo/pinewood-logo.svg
          git diff --check
      - name: Commit P1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/p1-ux-seo.yml
          git add js/main.js js/qr.js css/style.css css/wifi-layout-fix.css css/p1-ux.css _layouts/app.html .github/workflows/p1-ux-seo.yml
          git commit -m 'P1: refine Wi-Fi UX, performance and accessibility'
          git push origin HEAD:main

name: Rooms production assets

on:
  push:
    branches:
      - rooms-production-repair-20260905
    paths:
      - .github/workflows/rooms-production-assets.yml

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify uploaded originals
        shell: bash
        run: |
          set -euo pipefail
          echo "d4b4b511eb8db4c5192dbe852fa1eba5792f5a50fedbc8431ca2d11ebd59bd07  assets/images/pinewood-room-bedroom-original.jpg.jpg" | sha256sum -c -
          echo "c7e63c84b82f91b0446211dcb1669a7f3025557293a826e5b4a29e3d77cb127f  assets/images/pinewood-room-amenities-original.jpg.jpg" | sha256sum -c -
          echo "fe6b775eccd8d2625f16d0cf5df11bd6e43b27126066b74f1f59ceea4a0828e6  assets/images/pinewood-room-bathroom-original.jpg.jpg" | sha256sum -c -

      - name: Normalize filenames and generate responsive WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mv assets/images/pinewood-room-bedroom-original.jpg.jpg assets/images/pinewood-room-bedroom-original.jpg
          mv assets/images/pinewood-room-amenities-original.jpg.jpg assets/images/pinewood-room-amenities-original.jpg
          mv assets/images/pinewood-room-bathroom-original.jpg.jpg assets/images/pinewood-room-bathroom-original.jpg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import hashlib

          expected = {
              'bedroom': 'd4b4b511eb8db4c5192dbe852fa1eba5792f5a50fedbc8431ca2d11ebd59bd07',
              'amenities': 'c7e63c84b82f91b0446211dcb1669a7f3025557293a826e5b4a29e3d77cb127f',
              'bathroom': 'fe6b775eccd8d2625f16d0cf5df11bd6e43b27126066b74f1f59ceea4a0828e6',
          }

          for slug, sha in expected.items():
              src = Path(f'assets/images/pinewood-room-{slug}-original.jpg')
              raw = src.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              assert actual == sha, (slug, actual)
              with Image.open(src) as opened:
                  opened.load()
                  assert opened.format == 'JPEG', (slug, opened.format)
                  clean = ImageOps.exif_transpose(opened).convert('RGB')
              assert clean.size == (1920, 1920), (slug, clean.size)

              sample = clean.resize((256, 256), Image.Resampling.BILINEAR)
              pixels = list(sample.getdata())
              purple = sum(1 for r, g, b in pixels if r-g > 40 and b-g > 30 and r > 100 and b > 100) / len(pixels)
              print(slug, 'purple_ratio', f'{purple:.6f}')
              assert purple < 0.05, f'{slug}: suspicious purple artifact ratio {purple:.4f}'

              out960 = clean.resize((960, 960), Image.Resampling.LANCZOS)
              out960.save(f'assets/images/pinewood-room-{slug}-960.webp', 'WEBP', quality=92, method=6)
              clean.save(f'assets/images/pinewood-room-{slug}-1920.webp', 'WEBP', quality=92, method=6)

          for path in sorted(Path('assets/images').glob('pinewood-room-*-*.webp')):
              if path.name.endswith('-960.webp') or path.name.endswith('-1920.webp'):
                  with Image.open(path) as im:
                      im.load()
                      print(path, im.format, im.size, hashlib.sha256(path.read_bytes()).hexdigest())
          PY

      - name: Validate Rooms source references
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            assets/images/pinewood-room-bedroom-960.webp \
            assets/images/pinewood-room-bedroom-1920.webp \
            assets/images/pinewood-room-amenities-960.webp \
            assets/images/pinewood-room-amenities-1920.webp \
            assets/images/pinewood-room-bathroom-960.webp \
            assets/images/pinewood-room-bathroom-1920.webp; do
            test -s "$f"
          done
          ! grep -Eq 'pinewood-room-(stay-card|bedroom-hq|amenities-card|amenities-hq|bathroom-card|bathroom-hq)' phong/index.html en/rooms/index.html
          grep -q 'loading="lazy"' phong/index.html
          grep -q 'loading="lazy"' en/rooms/index.html
          grep -q 'srcset=' phong/index.html
          grep -q 'srcset=' en/rooms/index.html
          grep -q 'rooms-details-section' css/room-gallery-hq.css
          grep -q 'rooms-info-section' css/room-gallery-hq.css
          git diff --check

      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/pinewood-room-bedroom-original.jpg \
                  assets/images/pinewood-room-amenities-original.jpg \
                  assets/images/pinewood-room-bathroom-original.jpg \
                  assets/images/pinewood-room-bedroom-960.webp \
                  assets/images/pinewood-room-bedroom-1920.webp \
                  assets/images/pinewood-room-amenities-960.webp \
                  assets/images/pinewood-room-amenities-1920.webp \
                  assets/images/pinewood-room-bathroom-960.webp \
                  assets/images/pinewood-room-bathroom-1920.webp
          git add -u assets/images/pinewood-room-bedroom-original.jpg.jpg \
                     assets/images/pinewood-room-amenities-original.jpg.jpg \
                     assets/images/pinewood-room-bathroom-original.jpg.jpg
          git commit -m "Prepare verified Pinewood room image assets"
          git push origin HEAD:rooms-production-repair-20260905

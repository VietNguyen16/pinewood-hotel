name: Diagnose breakfast blocks
on:
  push:
    branches: [breakfast-room-gallery-final]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect suspect blocks
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin breakfast-image-repair:refs/remotes/origin/breakfast-image-repair
          python3 - <<'PY'
          import subprocess, hashlib, re
          for n in [0,4,6,8,9]:
              path=f'.asset-repair/breakfast/part-{n:02d}'
              raw=subprocess.check_output(['git','show',f'origin/breakfast-image-repair:{path}'])
              clean=re.sub(rb'[^A-Za-z0-9+/=]',b'',raw)
              print(f'PART {n} LEN {len(clean)}')
              for i in range(0,len(clean),1000):
                  b=clean[i:i+1000]
                  print(n,i,len(b),hashlib.sha256(b).hexdigest(),b[:8].decode(errors='ignore'),b[-8:].decode(errors='ignore'))
          PY

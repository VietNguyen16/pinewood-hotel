name: Fix breakfast single-line layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-breakfast-single-line.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update breakfast markup and desktop styling
        shell: python
        run: |
          from pathlib import Path
          import re

          js_path = Path('js/main.js')
          js = js_path.read_text(encoding='utf-8')
          start = js.index('  function renderBreakfast(c) {')
          end = js.index('  function renderSafety(c) {', start)
          block = js[start:end]

          block = block.replace('<div class="shell info-feature">', '<div class="shell info-feature breakfast-info-feature">', 1)
          block = block.replace('<div class="feature-panel"><p class="eyebrow">', '<div class="feature-panel breakfast-time-panel"><p class="eyebrow">', 1)
          block = block.replace('<div class="big-time">${CONFIG.breakfast.from} — ${CONFIG.breakfast.to}</div>', '<div class="big-time breakfast-time">${CONFIG.breakfast.from} — ${CONFIG.breakfast.to}</div>', 1)
          block = block.replace('<p>${esc(timeNote)}</p>', '<p class="breakfast-time-note">${esc(timeNote)}</p>', 1)

          js = js[:start] + block + js[end:]
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('css/style.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Breakfast single-line desktop layout */'
          if marker not in css:
              css += '''\n\n/* Breakfast single-line desktop layout */\n@media (min-width: 900px) {\n  .breakfast-info-feature { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }\n  .breakfast-time-panel { padding-inline: clamp(28px, 3vw, 38px); }\n  .breakfast-time {\n    white-space: nowrap;\n    font-size: clamp(50px, 4.3vw, 64px);\n    letter-spacing: -.04em;\n  }\n  .breakfast-time-note {\n    margin-top: 22px;\n    white-space: nowrap;\n    font-size: 12.5px;\n    line-height: 1.6;\n  }\n}\n\n@media (min-width: 721px) and (max-width: 899px) {\n  .breakfast-time { white-space: nowrap; font-size: clamp(42px, 6vw, 54px); }\n  .breakfast-time-note { font-size: 12px; }\n}\n'''
          css_path.write_text(css, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "VietNguyen16"
          git config user.email "viet.ng106@gmail.com"
          git add js/main.js css/style.css
          git commit -m "Keep breakfast time and service note on one line"
          git push

components:
  bilingual_amenities:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{vi} / {en}"
    fields:
      - name: vi
        label: Tiếng Việt
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true

media:
  - name: deluxe_double_views
    label: Deluxe Double - City & Garden
    input: assets/images/rooms/deluxe-double-views
    output: /assets/images/rooms/deluxe-double-views
    rename: safe
    categories: [image]
  - name: deluxe_twin_views
    label: Deluxe Twin - City & Garden
    input: assets/images/rooms/deluxe-twin-views
    output: /assets/images/rooms/deluxe-twin-views
    rename: safe
    categories: [image]
  - name: junior_suite_city_view
    label: Junior Suite City View
    input: assets/images/rooms/junior-suite-city-view
    output: /assets/images/rooms/junior-suite-city-view
    rename: safe
    categories: [image]
  - name: pinewood_suite_city_view
    label: Pinewood Suite City View
    input: assets/images/rooms/pinewood-suite-city-view
    output: /assets/images/rooms/pinewood-suite-city-view
    rename: safe
    categories: [image]
  - name: triple_suite_garden_view
    label: Triple Suite Garden View
    input: assets/images/rooms/triple-suite-garden-view
    output: /assets/images/rooms/triple-suite-garden-view
    rename: safe
    categories: [image]
  - name: family_suite_city_view
    label: Family Suite City View
    input: assets/images/rooms/family-suite-city-view
    output: /assets/images/rooms/family-suite-city-view
    rename: safe
    categories: [image]


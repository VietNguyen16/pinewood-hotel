          - { name: room_count, label: Số lượng phòng, type: number, required: true }
          - { name: guest_count, label: Số khách, type: number, required: true }
          - { name: size_m2, label: Diện tích (m²), type: number, required: true }
          - { name: bed_vi, label: Giường - tiếng Việt, type: string, required: true }

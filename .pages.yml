content:
  - name: room_manager
    label: Hạng phòng
    type: group
    items:
      - name: double_room_garden_view
        label: Double Room with Garden View
        type: file
        path: _data/room_types/double-room-garden-view.yml
        format: yaml
        fields: &room_fields_double
          - name: enabled
            label: Hiển thị trên website
            type: boolean
          - name: name_vi
            label: Tên tiếng Việt
            type: string
            required: true
          - name: name_en
            label: English name
            type: string
            required: true
          - name: guests
            label: Số khách
            type: number
            required: true
          - name: bed_vi
            label: Giường - tiếng Việt
            type: string
            required: true
          - name: bed_en
            label: Beds - English
            type: string
            required: true
          - name: description_vi
            label: Mô tả tiếng Việt (không bắt buộc)
            type: text
          - name: description_en
            label: English description (optional)
            type: text
          - name: images
            label: Hình ảnh - kéo thả, ảnh đầu tiên là ảnh chính
            type: image
            options:
              media: double_room_garden_view
              multiple:
                max: 12
              unique: true
              extensions: [jpg, jpeg, png, webp, avif]
              rename: safe

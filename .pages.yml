components:
  bilingual_amenities:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{vi} / {en}"
    fields:
      - name: vi
        label: Tiếng Việt
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true

media:
  - name: double_room_garden_view
    label: Double Room with Garden View
    input: assets/images/rooms/double-room-garden-view
    output: /assets/images/rooms/double-room-garden-view
    rename: safe
    categories: [image]
  - name: deluxe_double_or_twin_room
    label: Deluxe Double or Twin Room
    input: assets/images/rooms/deluxe-double-or-twin-room
    output: /assets/images/rooms/deluxe-double-or-twin-room
    rename: safe
    categories: [image]
  - name: junior_suite_garden_view
    label: Junior Suite with Garden View
    input: assets/images/rooms/junior-suite-garden-view
    output: /assets/images/rooms/junior-suite-garden-view
    rename: safe
    categories: [image]
  - name: king_suite_balcony
    label: King Suite with Balcony
    input: assets/images/rooms/king-suite-balcony
    output: /assets/images/rooms/king-suite-balcony
    rename: safe
    categories: [image]
  - name: triple_room_balcony
    label: Triple Room with Balcony
    input: assets/images/rooms/triple-room-balcony
    output: /assets/images/rooms/triple-room-balcony
    rename: safe
    categories: [image]
  - name: family_suite_balcony
    label: Family Suite with Balcony
    input: assets/images/rooms/family-suite-balcony
    output: /assets/images/rooms/family-suite-balcony
    rename: safe
    categories: [image]
  - name: twin_room_garden_view
    label: Twin Room with Garden View
    input: assets/images/rooms/twin-room-garden-view
    output: /assets/images/rooms/twin-room-garden-view
    rename: safe
    categories: [image]
  - name: twin_room_city_view
    label: Twin Room with City View
    input: assets/images/rooms/twin-room-city-view
    output: /assets/images/rooms/twin-room-city-view
    rename: safe
    categories: [image]


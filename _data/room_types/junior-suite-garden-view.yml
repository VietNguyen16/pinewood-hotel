summary_vi: Suite 1 phòng ngủ có điều hòa, lối vào riêng, cách âm, ban công và tầm nhìn ra vườn.
summary_en: A one-bedroom air-conditioned suite with a private entrance, soundproofing, a balcony and garden views.
description_vi: >-
  Suite có lối vào riêng, điều hòa, 1 phòng ngủ và 1 phòng tắm với vòi sen và bidet. Phòng có ban công nhìn ra vườn, tường cách âm và TV màn hình phẳng với các kênh vệ tinh. Phòng có 1 giường.
description_en: >-
  Featuring a private entrance, this air-conditioned suite comprises 1 bedroom and 1 bathroom with a shower and a bidet. Boasting a balcony with garden views, this suite also provides soundproof walls and a flat-screen TV with satellite channels. The unit offers 1 bed.

summary_en: An air-conditioned twin room with a balcony, private bathroom and city views.
description_vi: >-
  Hạng Twin hướng thành phố kết hợp hai giường riêng với ban công và tầm nhìn ra cảnh quan đô thị Đà Lạt. Không gian 26 m² được bố trí đầy đủ khu vực ngồi, điều hòa, TV và minibar, phù hợp với phong cách lưu trú gọn gàng nhưng vẫn đảm bảo sự thoải mái.
description_en: >-
  This air-conditioned twin room includes a flat-screen TV with satellite channels, a private bathroom as well as a balcony with city views. The unit has 2 beds.

summary_vi: Một không gian nghỉ rộng rãi với giường King, ban công riêng và phòng tắm có bồn tắm, mang lại trải nghiệm thoải mái hơn trong mỗi kỳ lưu trú.
summary_en: A one-bedroom suite with a balcony, air conditioning, soundproofing and city views.
description_vi: >-
  Điểm nổi bật của King Suite là không gian 40 m², giường King và ban công nhìn về phía thành phố. Phòng tắm riêng có cả bồn tắm và vòi sen, kết hợp cùng khu vực ngồi, minibar và khả năng cách âm để mang lại trải nghiệm lưu trú thoải mái và trọn vẹn hơn.
description_en: >-
  Boasting a private entrance, this air-conditioned suite includes 1 bedroom and 1 bathroom with a bath and a shower. Featuring a balcony with city views, this suite also offers soundproof walls and a flat-screen TV with satellite channels. The unit has 1 bed.

summary_vi: Phòng Deluxe rộng rãi, có điều hòa, cách âm, lối vào riêng và tầm nhìn ra thành phố.
summary_en: A spacious air-conditioned Deluxe room with soundproofing, a private entrance and city views.
description_vi: >-
  Phòng có đồ vệ sinh cá nhân miễn phí và phòng tắm riêng với vòi sen, bidet và máy sấy tóc. Không gian rộng rãi có điều hòa, TV màn hình phẳng với các kênh vệ tinh, lối vào riêng, tường cách âm, minibar và tầm nhìn ra thành phố. Phòng có 1 giường.
description_en: >-
  Providing free toiletries, this double room includes a private bathroom with a shower, a bidet and a hairdryer. The spacious air-conditioned double room provides a flat-screen TV with satellite channels, a private entrance, soundproof walls, a mini-bar as well as city views. The unit offers 1 bed.

summary_vi: Một lựa chọn tinh gọn cho kỳ nghỉ đôi, với giường lớn êm ái và góc nhìn hướng về thành phố Đà Lạt.
summary_en: A refined choice for two, with a generous double bed and views across the Da Lat cityscape.
description_vi: >-
  Deluxe Double hướng thành phố phù hợp cho những kỳ nghỉ cần sự riêng tư, gọn gàng và dễ chịu. Tầm nhìn thành phố tạo thêm chiều sâu cho không gian, trong khi cách bố trí một giường lớn mang lại cảm giác thư thái cho hai khách sau một ngày khám phá Đà Lạt.
description_en: >-
  The Deluxe Double City View is designed for guests who appreciate privacy, simplicity and an easy sense of comfort. Its city outlook adds character to the room, while the generous double bed creates a restful setting for two after a day in Da Lat.

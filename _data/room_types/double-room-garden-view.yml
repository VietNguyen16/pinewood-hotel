summary_vi: Một lựa chọn nhẹ nhàng cho kỳ nghỉ đôi, với ban công riêng và không gian yên tĩnh để thư giãn sau một ngày khám phá Đà Lạt.
summary_en: A spacious air-conditioned double room with soundproofing, a private entrance and garden views.
description_vi: >-
  Không gian 26 m² hướng ra khu vườn mang đến cảm giác nhẹ nhàng và riêng tư cho kỳ nghỉ tại Đà Lạt. Phòng có ban công, giường Queen, khu vực ngồi, minibar và khả năng cách âm, đi cùng phòng tắm riêng với đầy đủ những tiện nghi cần thiết.
description_en: >-
  Offering free toiletries, this double room includes a private bathroom with a shower, a bidet and a hairdryer. The spacious air-conditioned double room offers a flat-screen TV with satellite channels, a private entrance, soundproof walls, a mini-bar as well as garden views. The unit has 1 bed.

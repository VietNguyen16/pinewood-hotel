summary_vi: Một lựa chọn linh hoạt cho ba khách, kết hợp không gian rộng rãi với tầm nhìn hướng vườn dễ chịu.
summary_en: A flexible option for three, combining generous space with relaxing garden views.
description_vi: >-
  Triple Suite hướng vườn được thiết kế cho những chuyến đi ba người cần sự thoải mái mà không phải tách thành nhiều phòng. Cách bố trí giường linh hoạt cùng không gian rộng giúp cả nhóm có thể nghỉ ngơi cùng nhau, trong khi tầm nhìn hướng vườn mang lại cảm giác nhẹ nhàng hơn cho kỳ lưu trú.
description_en: >-
  The Triple Suite Garden View is designed for three guests who want to stay together without compromising on comfort. Its flexible bed arrangement and generous layout make shared travel easier, while the garden outlook adds a calm and relaxed atmosphere.

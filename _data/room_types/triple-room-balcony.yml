summary_vi: Cách bố trí linh hoạt cùng không gian rộng rãi giúp hạng phòng này trở thành lựa chọn thuận tiện cho những chuyến đi ba người.
summary_en: A flexible and spacious layout that makes this room a convenient choice for three guests travelling together.
description_vi: >-
  Với diện tích 42 m² và cách bố trí một giường Queen cùng một giường Twin, hạng phòng Triple mang lại nhiều không gian sử dụng mà vẫn giữ được sự thoáng đãng. Ban công hướng vườn, khu vực ngồi và các tiện nghi trong phòng giúp việc nghỉ ngơi trở nên thuận tiện trong suốt thời gian lưu trú.
description_en: >-
  Offering free toiletries, this triple room includes a private bathroom with a shower, a bidet and a hairdryer. The spacious air-conditioned triple room offers a flat-screen TV with satellite channels, a private entrance, soundproof walls, a mini-bar as well as garden views. The unit offers 2 beds.

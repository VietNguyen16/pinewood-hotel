summary_vi: Phòng gia đình rộng rãi, có điều hòa, cách âm, minibar và tầm nhìn ra vườn lẫn thành phố.
summary_en: A spacious air-conditioned family room with soundproofing, a mini-bar, and both garden and city views.
description_vi: >-
  Family Suite là một trong những không gian rộng rãi nhất của Pinewood với diện tích 45 m² và ba giường. Căn phòng có ban công cùng tầm nhìn hướng vườn hoặc thành phố, đi kèm khu vực ngồi, minibar, điều hòa và hệ thống cách âm để mang lại sự thoải mái trong những kỳ nghỉ cần nhiều không gian hơn.
description_en: >-
  Offering free toiletries, this family room includes a private bathroom with a shower, a bidet and a hairdryer. The spacious air-conditioned family room offers a flat-screen TV with satellite channels, a private entrance, soundproof walls, a mini-bar as well as garden views. The unit has 3 beds.

summary_en: An air-conditioned twin room with a balcony, private bathroom and garden views.
description_vi: >-
  Hai giường Twin được bố trí trong không gian 26 m² với ban công nhìn ra khu vườn. Căn phòng hướng đến sự đơn giản và dễ chịu, với khu vực ngồi, điều hòa, TV, minibar cùng phòng tắm riêng đầy đủ tiện nghi cho nhu cầu lưu trú hằng ngày.
description_en: >-
  This air-conditioned twin room includes a flat-screen TV with satellite channels, a private bathroom as well as a balcony with garden views. The unit offers 2 beds.

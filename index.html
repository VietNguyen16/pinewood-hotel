<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pinewood Hotel Dalat</title>
  <meta name="description" content="Digital Guest Directory của Pinewood Hotel Dalat.">
  <meta name="theme-color" content="#ECEDE9">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pinewood Hotel Dalat">
  <meta property="og:description" content="Digital Guest Directory for Pinewood Hotel Dalat guests.">
  <meta property="og:url" content="https://pinewoodhotel.vn/">
  <link rel="canonical" href="https://pinewoodhotel.vn/">
  <link rel="icon" type="image/svg+xml" href="assets/logo/pinewood-logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header" id="site-header">
    <div class="header-inner shell">
      <a class="brand" href="#/" data-route aria-label="Pinewood Hotel Dalat home">
        <img src="assets/logo/pinewood-logo.svg" alt="Pinewood Hotel" width="82" height="89">
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation" id="desktop-nav"></nav>
      <div class="header-actions">
        <div class="language-switcher" aria-label="Language">
          <button type="button" data-lang="vi" aria-label="Tiếng Việt">VI</button>
          <span aria-hidden="true">|</span>
          <button type="button" data-lang="en" aria-label="English">EN</button>
        </div>
        <button class="menu-button" type="button" id="menu-button" aria-controls="mobile-menu" aria-expanded="false" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mobile-menu" id="mobile-menu" hidden>
      <nav class="mobile-nav shell" aria-label="Mobile navigation" id="mobile-nav"></nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1"></main>


  <footer class="site-footer">
    <div class="shell footer-inner">
      <img src="assets/logo/pinewood-logo.svg" alt="Pinewood Hotel" width="64" height="69" loading="lazy">
      <div class="footer-copy">
        <strong>Pinewood Hotel Dalat</strong>
        <p id="footer-line" class="footer-slogan-link"></p>
        <div class="footer-contacts" aria-label="Pinewood Hotel contact information">
          <a class="footer-contact" href="tel:+84785098686">
            <svg aria-hidden="true"><use href="#i-phone"></use></svg>
            <span>0785 098 686</span>
          </a>
          <a class="footer-contact" href="mailto:info@pinewoodhotel.vn">
            <svg aria-hidden="true"><use href="#i-mail"></use></svg>
            <span>info@pinewoodhotel.vn</span>
          </a>
          <a class="footer-contact" href="https://pinewoodhotel.vn/">
            <svg aria-hidden="true"><use href="#i-globe"></use></svg>
            <span>pinewoodhotel.vn</span>
          </a>
        </div>
      </div>
      <button class="footer-support" type="button" id="footer-support"></button>
    </div>
  </footer>

  <dialog class="assistance-dialog" id="assistance-dialog" aria-labelledby="assistance-title">
    <button class="dialog-close" type="button" id="dialog-close" aria-label="Close">×</button>
    <img class="dialog-logo" src="assets/logo/pinewood-logo.svg" alt="Pinewood Hotel" width="74" height="80">
    <p class="eyebrow">PINEWOOD HOTEL DALAT</p>
    <h2 id="assistance-title"></h2>
    <p id="assistance-text"></p>
    <a class="phone-number" href="tel:+84785098686">0785 098 686</a>
    <a class="button button-primary button-full" href="tel:+84785098686" id="call-reception"></a>
    <div class="dialog-divider"><span>ZALO</span></div>
    <img class="zalo-qr" id="zalo-qr-dialog" alt="QR Zalo Pinewood Hotel Dalat" width="220" height="220">
    <p class="qr-caption" id="scan-zalo"></p>
  </dialog>

  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-rules" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 11h6M9 15h6"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0M9.5 17a4 4 0 0 1 5 0"/><circle cx="12" cy="20" r="1"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M5 9h11v7a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 11h2a3 3 0 0 1 0 6h-2M8 3c2 2-1 3 1 5M13 3c2 2-1 3 1 5"/></symbol>

    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3 4 5c0 8 7 15 15 15l2-3-5-3-2 2c-3-1-5-3-6-6l2-2z"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4C10 4 5 9 5 16c5 0 11-2 15-12Z"/><path d="M4 20c3-6 7-9 12-12"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3S6 10 6 15a6 6 0 0 0 12 0c0-5-6-12-6-12Z"/></symbol>
    <symbol id="i-bottle" viewBox="0 0 24 24"><path d="M9 3h6M10 3v4l-2 3v10h8V10l-2-3V3"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-7 12h6l-1 8 7-12h-6z"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M4 7l16 10M4 17 20 7M8 4l4 3 4-3M8 20l4-3 4 3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14 6a5 5 0 0 0-6 6L3 17l4 4 5-5a5 5 0 0 0 6-6l-3 3-4-4z"/></symbol>

    <symbol id="i-restaurant" viewBox="0 0 24 24"><path d="M7 3v7M4 3v5a3 3 0 0 0 6 0V3M7 10v11M16 3v18M16 3c4 2 4 8 0 9"/></symbol>

    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 15h4"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h.01M18 15h.01"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><circle cx="8" cy="8" r="2"/><circle cx="16" cy="8" r="2"/><circle cx="5" cy="13" r="2"/><circle cx="19" cy="13" r="2"/><path d="M8 18c0-3 2-5 4-5s4 2 4 5c0 2-2 3-4 3s-4-1-4-3Z"/></symbol>
    <symbol id="i-noSmoking" viewBox="0 0 24 24"><path d="M4 16h14v3H4zM19 16h2v3h-2M14 8c3 0 4 2 4 5M17 5c3 0 4 2 4 5M4 4l16 16"/></symbol>

    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4 6 4 9s-1 6-4 9M12 3c-3 3-4 6-4 9s1 6 4 9"/></symbol>
  </svg>

  <script src="js/qr.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/content.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>

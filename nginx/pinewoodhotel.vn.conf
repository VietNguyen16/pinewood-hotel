server {
    listen 80;
    listen [::]:80;
    server_name pinewoodhotel.vn www.pinewoodhotel.vn;
    return 301 https://pinewoodhotel.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pinewoodhotel.vn;

    ssl_certificate /etc/letsencrypt/live/pinewoodhotel.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinewoodhotel.vn/privkey.pem;

    return 301 https://pinewoodhotel.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pinewoodhotel.vn;

    root /var/www/pinewoodhotel.vn;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pinewoodhotel.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinewoodhotel.vn/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

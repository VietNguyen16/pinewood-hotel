<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Pine forest illustration</title>
  <desc id="desc">A soft layered pine forest inspired by Da Lat, using Pinewood Hotel brand colors.</desc>
  <defs>

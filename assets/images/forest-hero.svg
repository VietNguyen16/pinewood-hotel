      <stop offset="0" stop-color="#F3E7CE"/>
      <stop offset="0.68" stop-color="#F3E7CE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF6E3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6E3" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#F8E8C8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFF6E3" stop-opacity="0.92"/>
